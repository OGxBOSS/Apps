<style>

/* One app shell: content on top, a contextual action panel above a fixed tab bar */
:root{
 --bg:#000;--surface:#0c0e12;--raise:#15181e;--fg:#f1f3f7;--mut:#8f9aae;--line:#1e232c;
 --acc:#4f86ff;--acc-ink:#fff;--acc-soft:rgba(79,134,255,.16);--bar:#1d2330;--bar-ink:#e9edf6;--cb:#eab308;--cb-soft:rgba(234,179,8,.18);
 --good:#34c76a;--good-soft:rgba(52,199,106,.17);--bad:#f26a6a;--bad-soft:rgba(242,106,106,.16);--warn:#e58a1f;
 --shadow:0 0 0 1px rgba(255,255,255,.04);--hl:#fff;--botH:200px;color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0;margin:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#sp{flex:none;height:200px}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 28px}

html,body{background:#000}

button{transition:transform .12s ease,background-color .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.96)}

.tier-bubble:active,.pkg-card:active,.pkg-btn:active,.yn-btn:active{transform:scale(.97)}

#goalbar>*:not(i){transition:opacity .2s}

.chip.act{background:var(--acc-soft);color:var(--acc);box-shadow:none}.chip.act i{color:var(--acc)}
.brkb{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
#nd{height:64px}

/* ===== Iron Fall ===== */

// ===== Lovecraft: the game launcher =====
// One profile, many games. Lives on its own as the Lovecraft app and also inside Street Sheet behind the Games button.
// Coins buy cosmetics. Everyone starts at zero. They come from doors knocked after joining (one each), from wars in Iron Fall,
// and from wagers. Game coins and wagers live in a ledger at /lc/l/{id}/{key}: fixed keys, so writing an entry twice changes nothing.
if(typeof DW!=='undefined')window.DW=DW;if(typeof IF!=='undefined')window.IF=IF;
const LC=(()=>{
const LK='lovecraft.prof',INSS=!window.LC_SA&&typeof S!=='undefined'&&!!(S&&S.sessions),EMB=!!window.LC_EMB,PAR=EMB?window.parent:null;
let P0={};try{P0=JSON.parse(localStorage.getItem(LK)||'{}')||{}}catch(e){P0={}}
let rec={sp:0,own:{},eq:{},xp:{}},remoteDr=0,el=null,ret='',badges={},open=false;
try{const r=JSON.parse(localStorage.getItem(LK+'.rec')||'null');if(r&&typeof r==='object'&&(!r.id||r.id===me().id)){rec={...rec,...r};remoteDr=+r.dr0||0}}catch(e){}
const save0=()=>{try{localStorage.setItem(LK,JSON.stringify(P0))}catch(e){}},keep=()=>{try{localStorage.setItem(LK+'.rec',JSON.stringify({...rec,dr0:remoteDr,id:me().id}))}catch(e){}};
const lcBase=p=>relay()+'/teams/'+teamCode()+'/lc'+(p||'')+'.json';
// ---- who you are
function me(){if(INSS||EMB)return{id:T().id||'',name:T().name||'You',pic:(S.prof&&S.prof.pic)||'',ss:1};return{id:P0.id||'',name:P0.name||'',pic:P0.pic||rec.pic||'',ss:P0.ss?1:0}}
// Lifetime doors only ever go up: deleting an old street does not take coins back.
function doorsNow(){let n=0;for(const s of S.sessions){if(s.test)continue;for(const r of s.rows)if(r.t==='door')n++}return n}
function doorsAll(){if(EMB)try{return SSH.doorsAll()}catch(e){return 0}if(!INSS)return remoteDr;if(!(S.lcd>=0))S.lcd=doorsNow();return S.lcd}
function door(){if(!INSS)return;if(!(S.lcd>=0))S.lcd=doorsNow()-1;S.lcd++;try{save()}catch(e){}if(open)draw()}
function deals(){if(INSS||EMB)try{return dealsTotal()}catch(e){}return +rec.bd||0}
let L={};try{L=JSON.parse(localStorage.getItem(LK+'.led')||'{}')||{}}catch(e){L={}}
const ledSum=()=>{let n=0;for(const k in L)n+=+(L[k]&&L[k].v)||0;return n};
// doors only count from the day you joined Lovecraft (rec.db is your door count then)
const doorCoins=()=>rec.v>=2?Math.max(0,doorsAll()-(+rec.db||0)):0;
// coins only come from games and wagers. Knocking doors does not earn coins
const coins=()=>Math.max(0,ledSum()-(rec.sp|0));
let wrote={};try{wrote=JSON.parse(localStorage.getItem('lovecraft.wrote')||'{}')||{}}catch(e){wrote={}}
function led(id,key,v,why){if(!id||!key)return;key=String(key).replace(/[.#$\[\]\/]/g,'_');v=Math.round(+v||0);const wk=id+'|'+key;if(wrote[wk]===v)return;wrote[wk]=v;try{localStorage.setItem('lovecraft.wrote',JSON.stringify(wrote))}catch(e){}
 if(id===me().id){L[key]={v,why};try{localStorage.setItem(LK+'.led',JSON.stringify(L))}catch(e){}if(open)draw()}
 fetch(lcBase('/l/'+id+'/'+key),{method:'PUT',body:JSON.stringify({v,why:String(why||'').slice(0,40),ts:{'.sv':'timestamp'}})}).catch(()=>{delete wrote[wk]})}
// a race wager: the first phone to see the race end records who won at /lc/r/{race}, and everyone pays out from that record
async function settleRace(cid,a,b,w,win){const u=lcBase('/r/'+cid);let r=null;try{r=await fetch(u).then(x=>x.json())}catch(e){return}
 if(!r||!('win' in r)){r={win,w};try{await fetch(u,{method:'PUT',body:JSON.stringify({win,w,ts:{'.sv':'timestamp'}})})}catch(e){return}}
 if(r.win)led(r.win,'rs'+cid,2*r.w,'Race wager won');else{led(a,'rs'+cid,r.w,'Race wager tie');led(b,'rs'+cid,r.w,'Race wager tie')}}
async function pullLed(){const id=me().id;if(!id)return;try{const r=await fetch(lcBase('/l/'+id));const d=await r.json();L=d&&typeof d==='object'?d:{};localStorage.setItem(LK+'.led',JSON.stringify(L))}catch(e){}}
// experience comes only from games played in Lovecraft, so everyone starts at level 0
function xpTotal(){let n=0;for(const k in rec.xp||{})n+=+rec.xp[k]||0;return n}
const XPD=50,lcD=xp=>Math.floor(xp/XPD),lcLvl=xp=>lvlOf(lcD(xp));
async function pull(){const id=me().id;if(!id)return;
 if(!INSS&&!EMB&&P0.ss){try{const r=await fetch(relay()+'/teams/'+teamCode()+'/members/'+id+'.json'),d=await r.json();if(d){remoteDr=+d.dr||0;rec.bd=+d.bd||0;if(d.pic&&!P0.pic)rec.pic=d.pic;keep()}}catch(e){}}
 let ok=false;try{const r=await fetch(lcBase('/p/'+id));if(r.ok){const d=await r.json();ok=true;if(d&&typeof d==='object')rec={sp:0,own:{},eq:{},xp:{},...d,pic:rec.pic};else rec={sp:0,own:{},eq:{},xp:{},pic:rec.pic}}}catch(e){}
 // fresh start for Lovecraft: zero coins, level 0, nothing bought yet. Doors and Street Sheet history do not carry over
 if(ok&&!(rec.v>=3)){rec={...rec,v:3,sp:0,own:{},eq:{},xp:{}};delete rec.db;patch({v:3,sp:0,own:null,eq:null,xp:null,db:null});try{IF.skinChanged()}catch(e){}}
 for(const k of ['own','eq','xp'])if(!rec[k]||typeof rec[k]!=='object')rec[k]={};
 keep();await pullLed();draw()}
function patch(o){const id=me().id;if(!id)return;keep();fetch(lcBase('/p/'+id),{method:'PATCH',body:JSON.stringify(o)}).catch(()=>{})}
function addXp(k,v){v=Math.round(+v||0);k=String(k).replace(/[.#$\[\]\/]/g,'_');if(!(v>(+rec.xp[k]||0)))return;rec.xp[k]=v;patch({['xp/'+k]:v})}
function skins(){const e=rec.eq||{};return{s:e.s||'woodland',m:e.m||'factory',t:e.t||'standard',h:e.h||'concrete'}}
// ---- the screen
// bump a game's version here whenever it changes: its tile shows UPDATED until you open it
const GV={dw:'0.42.0',if:'1.8.0'};let seenV=null;try{seenV=JSON.parse(localStorage.getItem('lovecraft.seen')||'null')}catch(e){}
function seenInit(){if(seenV)return;seenV=me().id?{}:{...GV};try{localStorage.setItem('lovecraft.seen',JSON.stringify(seenV))}catch(e){}}
const isNew=k=>GV[k]&&seenV&&seenV[k]!==GV[k];
function markSeen(k){if(!GV[k])return;seenInit();seenV[k]=GV[k];try{localStorage.setItem('lovecraft.seen',JSON.stringify(seenV))}catch(e){}}
const GAMES=[{k:'dw',n:'Door Wars',sub:'Turn your doors into an empire'},{k:'if',n:'Iron Fall',sub:'Mechs, fog and ruined farmland'},{k:'rsf',n:'Ready Set Fight',soon:1},{k:'7sp',n:'7 Samurai',soon:1},{k:'mm',n:'Myth and Metal',soon:1},{k:'cnc',n:'Code Name Crimson',soon:1}];
function build(){el=h('div',{class:'lcw',hidden:true},h('div',{class:'lctop'},INSS||EMB?h('button',{class:'lcbk',type:'button','aria-label':'Back to Street Sheet',onclick:()=>{if(EMB)PAR.GP.hide();else hide()}},'‹'):null,h('div',{class:'lcbrand'},h('img',{src:LCA.logo,alt:'Lovecraft',class:'lclogo'}),h('span',{},'GAMES')),h('button',{class:'lcme',type:'button',onclick:profile})),
 h('div',{class:'lcgrid'},...GAMES.map(gm=>h('button',{class:'lct lct-'+gm.k+(gm.soon?' soon':''),type:'button',onclick:()=>play(gm.k)},h('div',{class:'lcart'}),h('i',{class:'lcup',hidden:true},'UPDATED'),h('div',{class:'lccap'},h('b',{},gm.n),gm.soon?h('em',{},'COMING SOON'):h('small',{},gm.sub)),h('i',{class:'lcbd',hidden:true})))),
