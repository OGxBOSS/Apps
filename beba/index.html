<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BEBA</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f2f7;--panel:#fff;--text:#111;--sub:#6b6b73;--line:#d8d8de;
  --needs:#2f6fed;--wants:#f08a1c;--accent:#111;--accent-text:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--panel:#1c1c1e;--text:#f5f5f7;--sub:#9a9aa2;--line:#38383c;--needs:#5b93ff;--wants:#ffa13d;--accent:#f5f5f7;--accent-text:#111}
}
:root[data-theme="dark"]{--bg:#000;--panel:#1c1c1e;--text:#f5f5f7;--sub:#9a9aa2;--line:#38383c;--needs:#5b93ff;--wants:#ffa13d;--accent:#f5f5f7;--accent-text:#111}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 10px 8px}
#cols{flex:1;min-height:0;display:flex;gap:8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:16px;padding:8px}
.col h2{margin:2px 0;text-align:center;font-size:15px;letter-spacing:1.5px;font-weight:800}
.needs h2{color:var(--needs)}.wants h2{color:var(--wants)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.card{position:relative;text-align:left;border:0;border-radius:12px;padding:10px 30px 10px 10px;width:100%;cursor:pointer}
.needs .card{background:color-mix(in srgb,var(--needs) 18%,var(--panel))}
.wants .card{background:color-mix(in srgb,var(--wants) 18%,var(--panel))}
.card .n{font-weight:600;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.card .a{font-size:12px;color:var(--sub);margin-top:3px}
.edit{position:absolute;top:2px;right:2px;width:30px;height:30px;border:0;background:none;color:var(--sub);font-size:15px;cursor:pointer}
.empty{color:var(--sub);font-size:12px;text-align:center;padding:12px 4px}
.pot{text-align:center;border-radius:12px;padding:7px 4px;background:color-mix(in srgb,currentColor 12%,var(--panel))}
.needs .pot{color:var(--needs)}.wants .pot{color:var(--wants)}
.pot small{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;opacity:.9}
.pot b{display:block;font-size:15px;color:var(--text);margin:1px 0}
.pot span{font-size:11px;color:var(--sub)}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--accent-text)}
#row{display:flex;gap:10px}
#add{flex:1;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:17px;padding:14px;cursor:pointer}
#total{flex:1.3;background:var(--panel);border-radius:14px;text-align:center;padding:7px 4px;min-width:0}
#total small{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--sub)}
#total b{font-size:17px}
#total span{font-size:12px;color:var(--sub);margin-left:3px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-size:18px}
.sheet label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin-bottom:4px}
.sheet input,.sheet textarea{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.sheet textarea{resize:none;min-height:46px}
.sheet .seg{background:var(--bg)}
.btns{display:flex;gap:8px}
.btns button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;background:var(--bg)}
.btns .pri{background:var(--accent);color:var(--accent-text)}
.btns .pri:disabled{opacity:.35}
.btns .del{color:#e5484d}
.big{padding:18px!important;font-size:18px}
</style>
</head>
<body>
<div id="app">
  <div id="cols">
    <section class="col needs"><h2>NEEDS</h2><div class="list" id="l-needs"></div>
      <div class="pot"><small>NEEDS POT</small><b id="p-needs"></b><span class="fq"></span></div></section>
    <section class="col wants"><h2>WANTS</h2><div class="list" id="l-wants"></div>
      <div class="pot"><small>WANTS POT</small><b id="p-wants"></b><span class="fq"></span></div></section>
  </div>
  <div class="seg" id="gfreq"></div>
  <div id="row">
    <button id="add">+ Add</button>
    <div id="total"><small>TOTAL</small><b id="t-amt"></b><span class="fq"></span></div>
  </div>
</div>
<div id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='beba.v1';
const WEEKS={weekly:1,biweekly:2,monthly:52/12};   // monthly = average month (52/12 weeks)
const LABEL={weekly:'Weekly',biweekly:'Biweekly',monthly:'Monthly'};
const conv=(a,from,to)=>a/WEEKS[from]*WEEKS[to];
const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

let S={expenses:[],freq:'weekly'};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw);
    if(Array.isArray(d.expenses))S.expenses=d.expenses;
    if(WEEKS[d.freq])S.freq=d.freq;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const disp=x=>conv(x.amount,x.freq,S.freq);
const pot=c=>S.expenses.filter(x=>x.cat===c).reduce((t,x)=>t+disp(x),0);

function render(){
  for(const c of ['needs','wants']){
    const items=S.expenses.filter(x=>x.cat===c);
    $('l-'+c).innerHTML=items.length?items.map(x=>
      `<button class="card" data-id="${x.id}"><div class="n">${esc(x.name)}</div>
       <div class="a">${fmt.format(disp(x))} ${S.freq}</div>
       <span class="edit" data-edit="${x.id}" role="button" aria-label="Edit">✎</span></button>`).join('')
      :'<div class="empty">Nothing here yet</div>';
    $('p-'+c).textContent=fmt.format(pot(c));
  }
  $('t-amt').textContent=fmt.format(pot('needs')+pot('wants'));
  document.querySelectorAll('.fq').forEach(e=>e.textContent=S.freq);
  $('gfreq').innerHTML=Object.keys(WEEKS).map(f=>
    `<button data-f="${f}" class="${f===S.freq?'on':''}">${LABEL[f]}</button>`).join('');
}

// taps: move card / open editor / change global frequency
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');
  if(ed){e.stopPropagation();openEditor(S.expenses.find(x=>x.id===ed.dataset.edit));return}
  const card=e.target.closest('.card');
  if(card){const x=S.expenses.find(y=>y.id===card.dataset.id);
    if(x){x.cat=x.cat==='needs'?'wants':'needs';save();render()}return}
  const f=e.target.closest('#gfreq [data-f]');
  if(f){S.freq=f.dataset.f;save();render()}
});
$('add').onclick=()=>{
  $('sheet').innerHTML=`<h3>Add to…</h3>
    <div class="btns"><button class="big" data-c="needs" style="color:var(--needs)">NEEDS</button>
    <button class="big" data-c="wants" style="color:var(--wants)">WANTS</button></div>
    <div class="btns"><button id="cx">Cancel</button></div>`;
  $('ov').classList.add('show');
  $('sheet').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>
    openEditor({id:null,name:'',amount:0,freq:S.freq,cat:b.dataset.c}));
  $('cx').onclick=close;
};
function close(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))close()});

function openEditor(x){
  const isNew=!x.id; const d={...x};
  const sh=$('sheet');
  sh.innerHTML=`<h3>${isNew?'New expense':'Edit expense'}</h3>
    <div><label>Category</label><div class="seg" id="e-cat"></div></div>
    <div><label>Name</label><textarea id="e-name" rows="1"></textarea></div>
    <div><label>Amount</label><input id="e-amt" inputmode="decimal" placeholder="0.00"></div>
    <div><label>Frequency (how you pay it)</label><div class="seg" id="e-freq"></div></div>
    <div class="btns">${isNew?'':'<button class="del" id="e-del">Delete</button>'}
      <button id="e-cancel">Cancel</button><button class="pri" id="e-save">Save</button></div>`;
  $('e-name').value=d.name;
  $('e-amt').value=d.amount?String(d.amount):'';
  const segs=()=>{
    $('e-cat').innerHTML=['needs','wants'].map(c=>`<button data-k="${c}" class="${d.cat===c?'on':''}">${c.toUpperCase()}</button>`).join('');
    $('e-freq').innerHTML=Object.keys(WEEKS).map(f=>`<button data-k="${f}" class="${d.freq===f?'on':''}">${LABEL[f]}</button>`).join('');
  };
  segs();
  $('e-cat').onclick=e=>{const k=e.target.dataset.k;if(k){d.cat=k;segs()}};
  $('e-freq').onclick=e=>{const k=e.target.dataset.k;if(k){d.freq=k;segs()}};
  const amt=()=>parseFloat($('e-amt').value.replace(',','.'));
  const ok=()=>{$('e-save').disabled=!($('e-name').value.trim()&&amt()>0)};
  $('e-name').oninput=ok;$('e-amt').oninput=ok;ok();
  $('e-cancel').onclick=close;
  if(!isNew)$('e-del').onclick=()=>{S.expenses=S.expenses.filter(y=>y.id!==d.id);save();render();close()};
  $('e-save').onclick=()=>{
    d.name=$('e-name').value.trim();d.amount=amt();
    if(isNew){d.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.expenses.push(d)}
    else{const i=S.expenses.findIndex(y=>y.id===d.id);if(i>-1)S.expenses[i]=d}
    save();render();close();
  };
  $('ov').classList.add('show');
}
render();
</script>
</body>
</html>
