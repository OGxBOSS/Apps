<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doors">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Door Tracker</title>
<style>
/* One app shell: content on top, a contextual action panel above a fixed tab bar */
:root{
 --bg:#edf0f6;--surface:#ffffff;--raise:#f3f5f9;--fg:#0e1526;--mut:#5d6b82;--line:#e3e8f0;
 --acc:#2563ff;--acc-ink:#ffffff;--acc-soft:rgba(37,99,255,.11);
 --good:#14a14a;--good-soft:rgba(20,161,74,.15);--bad:#dc2626;--bad-soft:rgba(220,38,38,.13);--warn:#c96a00;
 --shadow:0 1px 2px rgba(14,21,38,.06),0 8px 24px rgba(14,21,38,.06);
 --hl:#0e1526;
 --botH:200px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#080a0e;--surface:#12151b;--raise:#1a1e27;--fg:#eef2f8;--mut:#98a5ba;--line:#242a35;
 --acc:#4f86ff;--acc-soft:rgba(79,134,255,.17);--good:#34c76a;--good-soft:rgba(52,199,106,.17);--bad:#f26a6a;--bad-soft:rgba(242,106,106,.16);--warn:#f2a03c;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--hl:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#080a0e;--surface:#12151b;--raise:#1a1e27;--fg:#eef2f8;--mut:#98a5ba;--line:#242a35;
 --acc:#4f86ff;--acc-soft:rgba(79,134,255,.17);--good:#34c76a;--good-soft:rgba(52,199,106,.17);--bad:#f26a6a;--bad-soft:rgba(242,106,106,.16);--warn:#f2a03c;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--hl:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0;margin:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#sp{flex:none;height:200px}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 28px}
.vh{padding:10px 2px 6px}.vh h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}.sub{margin:2px 0 0;color:var(--mut);font-size:14px;font-weight:600}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:20px 2px 8px}
.note{color:var(--mut);font-size:12.5px;margin:14px 2px 0;line-height:1.45}

/* Street header */
#top{background:var(--surface);padding:9px 10px 0}
#colh{flex:none;display:grid;grid-template-columns:19% 16% 21% 1fr 11%;height:21px;align-items:center;background:var(--surface);margin-bottom:-1px;color:var(--mut);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:left}
#colh span{padding:0 8px;line-height:1}#colh span:first-child,#colh span:last-child{text-align:center}
#top .pin{width:18px;height:18px;flex:none;display:grid;place-items:center;color:#fff;opacity:.85}
.pin svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ver{position:fixed;top:env(safe-area-inset-top,0px);left:8px;z-index:4;font-size:8px;line-height:9px;font-weight:700;letter-spacing:.04em;color:var(--mut);opacity:.7;pointer-events:none}
#dealAlert{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:50;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:dl .6s}
#dealAlert b{display:block;font-size:20px;letter-spacing:-.01em}#dealAlert small{display:block;font-size:13px;font-weight:700;opacity:.85;margin-top:2px}
#dealAlert.gold{padding:20px 18px;border:2px solid #fff3b0;background:linear-gradient(110deg,#b45309,#f59e0b 25%,#fde68a 50%,#f59e0b 75%,#b45309);background-size:250% 100%;color:#2a1700;box-shadow:0 0 0 4px rgba(253,230,138,.4),0 16px 44px rgba(245,158,11,.55);animation:dl .6s,gl 2.2s linear infinite}
#dealAlert.gold b{font-size:25px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em}
@keyframes dl{0%{transform:translateY(-130%)}60%{transform:translateY(6%)}100%{transform:none}}@keyframes gl{to{background-position:-250% 0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:49;pointer-events:none}
#gpsPill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:30;padding:7px 14px 7px 30px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(8,12,22,.3);opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .2s,transform .2s}
#gpsPill.show{opacity:1;transform:none}#gpsPill.bad{background:var(--warn)}
#gpsPill::before{content:'';position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff}
#gpsPill.busy::before{animation:gp 1s ease-out infinite}
@keyframes gp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 9px rgba(255,255,255,0)}}
#kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#kpi>*{position:relative;background:var(--raise);border:0;border-radius:11px;padding:5px 1px 4px;text-align:center;font:inherit;color:inherit}
#kpi b{display:block;font-size:16px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
#kpi span{display:block;font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-top:1px;white-space:nowrap}
#kpi b{white-space:nowrap}#t4 b{font-size:13.5px;letter-spacing:-.03em}#sheetBtn b{font-size:14px}#t2 b{color:var(--good)}#t5 b{color:var(--acc)}
#t5{box-shadow:inset 0 0 0 1.5px var(--acc-soft)}
#goalbar,#oddsbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:28px;margin-top:5px;padding:0 10px;border:0;border-radius:10px;background:var(--raise);overflow:hidden;font:inherit;color:inherit;text-align:left}
#gFill,#oFill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .5s}
#gFill{background:var(--good-soft)}#oFill{background:var(--acc-soft)}
#goalbar>*:not(i),#oddsbar>*:not(i){position:relative}
#gTag{font-size:9.5px;letter-spacing:.07em;font-weight:800;color:var(--mut)}
#gTxt{flex:1;font-size:13px;font-weight:800;text-align:center}
#gChev{font-size:18px;line-height:1;color:var(--mut);font-weight:600}
#goalbar.hot{background:var(--acc);color:var(--acc-ink)}#goalbar.hot #gFill{opacity:0}#goalbar.hot #gTag,#goalbar.hot #gChev{color:var(--acc-ink);opacity:.85}
#oTxt{flex:1;min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pace{font-size:12px;font-weight:800;white-space:nowrap}#pace{color:var(--acc)}#pace i{font-style:normal}#pace .u{color:var(--good)}#pace .d{color:var(--bad)}#pace.bh{color:var(--acc)}

/* Door list */
#main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;z-index:3;height:19px;line-height:1;background:var(--surface);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800;padding:0 8px;border-bottom:1px solid var(--line);text-align:left}
th:first-child,th:last-child{text-align:center}
td{border-bottom:1px solid var(--line);padding:0;height:48px}
td input{width:100%;height:48px;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:0 8px;outline:0}
td input:focus{background:var(--acc-soft)}
.a{font-weight:800;font-size:19px;text-align:center;letter-spacing:-.01em}
.rb{width:100%;height:48px;border:0;background:transparent;display:grid;place-items:center;padding:0 4px}
.pill{display:inline-block;max-width:100%;padding:5px 8px;border-radius:999px;background:var(--raise);color:var(--fg);font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.deal{background:var(--good);color:#fff}.pill.cb{background:var(--good-soft);color:var(--good)}.pill.rd{background:var(--bad-soft);color:var(--bad)}
.apt{width:100%;height:48px;border:0;background:transparent;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.8}
.apt.on{color:var(--good);opacity:1}.apt.on::before{content:'✓';font-size:19px;line-height:16px;font-weight:900}
.mark td{height:32px;text-align:center;background:var(--raise);color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.02em}
.turn td{position:sticky;z-index:2;background:var(--acc);color:#fff;text-align:left;padding:0 10px;cursor:pointer;border-bottom:0;box-shadow:0 1px 0 rgba(0,0,0,.18),0 3px 8px rgba(14,21,38,.14)}
#cbAlert{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:50;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:dl .6s}
#cbAlert b{display:block;font-size:18px;letter-spacing:-.01em}#cbAlert small{display:block;font-size:13px;font-weight:700;opacity:.9;margin-top:2px}
#kbar{position:absolute;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:6px 10px;background:var(--raise);border-top:1px solid var(--line)}
#kbar button{min-width:56px;height:38px;border:0;border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:20px;font-weight:800;box-shadow:0 1px 0 var(--line)}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.sug .b{width:auto;padding:0 14px;height:40px;font-size:15px}
#calcHost{padding-bottom:6px}
.cs{background:var(--surface);border-radius:18px;margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.cs>button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 16px;border:0;background:none;font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.cs>button i{font-style:normal;transition:transform .15s}.cs.open>button i{transform:rotate(180deg)}
.cs-b{display:none;padding:0 16px 14px}.cs.open>.cs-b{display:block}
.cl{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--mut)}.cs-b>.cl:first-child{margin-top:0}
.cin{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--fg);font:inherit;font-size:18px;font-weight:700;padding:0 14px;outline:0}.cin:focus{border-color:var(--acc)}
.cgrp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cgrp.c4{grid-template-columns:repeat(4,1fr)}
.cpb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--fg);font:inherit;font-size:15px;font-weight:800}
.cpb small{font-size:12px;color:var(--mut);font-weight:700}.cpb.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.cpb.on small{color:var(--acc-ink);opacity:.85}
.ceq{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cei b{display:block;font-size:14.5px}.cei small{color:var(--mut);font-size:12px;font-weight:600}
.cst{display:flex;align-items:center;gap:8px;flex:none}.cst button{width:38px;height:38px;border:0;border-radius:12px;background:var(--raise);color:var(--fg);font-size:20px;font-weight:800}.cst span{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.cbr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:15px}.cbr .v{font-weight:800}.cbr.neg .v{color:var(--bad)}
.cres{text-align:center}.cres .amt{font-size:46px;font-weight:800;letter-spacing:-.03em;color:var(--good);line-height:1.1}.cres .cap{color:var(--mut);font-size:13px;font-weight:700;margin-top:2px}
.cres .cs-b{padding:0 14px 10px;text-align:left}.cres .cs>button{text-align:left}
.cx{border:0;background:none;color:var(--mut);font-size:22px;line-height:1;padding:2px 8px}
.cbe{padding:8px 0;border-bottom:1px solid var(--line)}.cbt{display:flex;align-items:center;gap:4px}.cbt b{font-size:15px;white-space:nowrap}.cnm{height:42px!important;font-size:16px!important;flex:1;min-width:0}
.cdet{padding:6px 4px 2px;color:var(--mut)}
td input.a.srch{animation:sp 1s ease-in-out infinite}.a.srch::placeholder{font-size:12px;font-weight:700;letter-spacing:0;color:var(--acc);opacity:1}
@keyframes sp{50%{opacity:.35}}
#tb tr.fd:not(.turn){display:none}
.turn .mi i:not(.g):not(.r){max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa{flex:none;width:26px;height:24px;margin-right:8px;border:0;border-radius:8px;background:rgba(255,255,255,.24);display:grid;place-items:center;padding:0}.fa svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.turn .cv{font-size:12px;opacity:.9;margin-left:2px;align-self:center}
.turn .tn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:100%}
#st{flex:1;min-width:0;height:100%;border:0;background:transparent;color:#fff;font:inherit;font-size:16px;line-height:28px;font-weight:800;padding:0;outline:0}#st::placeholder{color:rgba(255,255,255,.75);font-weight:800}
.turn .tn b{font-size:13px;font-weight:800;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.turn .mi{display:flex;gap:6px;flex:none}
.turn .mi i{font-style:normal;font-size:11.5px;font-weight:800;line-height:16px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.2)}
.turn .mi i.g{background:#e8fff1;color:#047a3a}.turn .mi i.r{background:#ffe9ea;color:#c4202a}
.shc{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.shc.cur{box-shadow:0 0 0 2px var(--acc-soft),var(--shadow)}
.shh{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border:0;background:transparent;text-align:left;color:inherit}
.shh .rt{flex:1;min-width:0}.shh b{display:block;font-size:16px}.shh small{color:var(--mut);font-size:12.5px}
.shh .chev{color:var(--mut);font-size:22px;transition:transform .15s}.shc.open .chev{transform:rotate(90deg)}
.shb{padding:0 14px 14px}.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.cell{background:var(--raise);border-radius:12px;padding:8px 4px;text-align:center}.cell b{display:block;font-size:17px}.cell span{font-size:11px;color:var(--mut);font-weight:700}
.brk td{height:26px;text-align:center;background:var(--raise);color:var(--mut);font-size:12px;font-weight:700}
.gl td{background:var(--good-soft)}
.rd td{background:var(--bad-soft)}
.fl td{animation:fl 1.8s}@keyframes fl{0%,60%{background:rgba(250,204,21,.5)}}
tr.cur td{border-top:2px solid var(--hl);border-bottom:2px solid var(--hl)}
tr.sel .rb{outline:3px solid var(--acc);outline-offset:-6px;border-radius:14px;background:var(--acc-soft)}
.empty{height:150px;text-align:center;color:var(--mut);font-weight:600;border:0;padding:0 24px}
tr{touch-action:pan-y}

/* Bottom: contextual panel above the tab bar */
#bot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(14,21,38,.06);will-change:transform;touch-action:none}
#panel{display:flex;flex-direction:column;gap:8px;padding:10px 12px 6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{position:relative;height:42px;border:0;border-radius:13px;background:var(--raise);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.chip i{font-style:normal;font-size:15px;color:var(--acc)}
.chip.on{background:var(--bad);color:#fff}.chip.on i{color:#fff}
#cbn{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
#cbn:empty{display:none}
#panel .ndrow{display:flex;gap:8px}
.brkb{flex:0 0 25%;border:0;border-radius:18px;background:var(--raise);color:var(--mut);font-size:12.5px;font-weight:800;line-height:1.15;padding:0 6px;height:60px}
.brkb.on{background:var(--warn);color:#fff}
#nd{flex:1;height:60px;border:0;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-size:20px;font-weight:800;letter-spacing:.09em;box-shadow:0 6px 18px rgba(37,99,255,.32)}
#nd:active{transform:scale(.985)}
.plab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:0 2px -2px}
.seg{display:flex;gap:2px;background:var(--raise);border-radius:13px;padding:3px}
.seg button{flex:1;min-width:0;height:36px;border:0;border-radius:10px;background:transparent;font-size:13.5px;font-weight:700;color:var(--mut)}
.seg.five button{font-size:12.5px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:46px;border:0;border-radius:14px;background:var(--raise);font-size:15px;font-weight:700}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
#tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#tabs button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 2px;font-size:10.5px;font-weight:700}
#tabs .ic{position:relative}#tabs .ic[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-3px;right:-1px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center}
#v-chat .vh{padding-bottom:8px}.mbs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.mbs::-webkit-scrollbar{display:none}
.mb{flex:none;padding:4px 10px;border-radius:99px;background:var(--raise);color:var(--mut);font-size:13px;font-weight:700}.mb.on{color:var(--fg)}.mb.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px}
#chatList{display:flex;flex-direction:column;padding:4px 14px 10px}
.cm{display:flex;flex-direction:column;align-items:flex-start;margin-top:3px;max-width:82%}.cm.f{margin-top:10px}.cm.me{align-self:flex-end;align-items:flex-end}
.cm .nm{color:var(--mut);font-size:12px;font-weight:700;margin:0 6px 2px}.cm .tm{color:var(--mut);font-size:11px;margin:2px 6px 0}
.cm .bb{padding:8px 12px;border-radius:18px;background:var(--raise);color:var(--fg);font-size:16px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.cm.me .bb{background:var(--acc);color:var(--acc-ink,#fff)}.cm.fl .bb{opacity:.55}.cm.fl .tm{color:var(--bad)}
.dv{align-self:center;margin:14px 0 4px;color:var(--mut);font-size:12px;font-weight:700}
.cm .bb.shc{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);font:inherit;font-size:16px;cursor:pointer;min-width:200px}.cm .bb.shc small{opacity:.75;font-size:12px}
#shBar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--acc);box-shadow:0 -8px 24px rgba(14,21,38,.12)}#shBar[hidden]{display:none}
