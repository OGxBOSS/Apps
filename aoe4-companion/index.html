<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AoE4 Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0b43c'/%3E%3Cpath d='M9 23l9-9 3 3-9 9z M16 9h8v3l-3 3-5-3z' fill='%230b0e13'/%3E%3C/svg%3E">
<style>
/* ═════════════ Tokens ═════════════ */
:root{
  --bg:#0b0e13; --surface:#151a21; --surface2:#1e252e; --line:#29313c; --text:#eef1f5; --muted:#8c97a6;
  --accent:#f0b43c; --accent-ink:#1a1204; --tint:rgba(240,180,60,.10); --good:#46c98b; --bad:#f06a6a; --wl:64%;
  --food:#ff7a6e; --wood:#d0a16a; --gold:#f2cf4a; --stone:#aeb8c4; --bld:#ffa94d;
  --r:16px; --ui-bottom:64px; --kb:0px;
  --cols:minmax(0,1fr) repeat(3,clamp(64px,19vw,108px)); /* ADJUSTABLE: stats columns (civ, all maps, map, you) */
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f2f3f6; --surface:#fff; --surface2:#eceef2; --line:#dfe3e9; --text:#12151a; --muted:#677285;
  --accent:#c98a0c; --accent-ink:#fff; --tint:rgba(201,138,12,.10); --good:#17945f; --bad:#d23c3c; --wl:38%;
  --food:#d4483d; --wood:#8a5a1f; --gold:#a8820a; --stone:#5d6773; --bld:#c26a00; color-scheme:light;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit;margin:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.k-f{color:var(--food)} .k-w{color:var(--wood)} .k-g{color:var(--gold)} .k-s{color:var(--stone)} .k-b{color:var(--bld)}

/* ═════════════ App shell ═════════════ */
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;overflow:hidden;position:relative}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;min-height:60px}
.title{flex:1;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.title span{color:var(--accent)}
.icon{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:800;background:var(--surface)}
.icon.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--accent)}
.tabs svg{width:26px;height:26px}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:16px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.dfill{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:active,.icon:active,.ib:active{transform:scale(.97)}
.seg{display:inline-flex;background:var(--surface);border-radius:14px;padding:3px;gap:2px;flex:none}
.seg button{padding:0 16px;min-height:42px;border-radius:11px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1}
.ib{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:17px;font-weight:800;display:grid;place-items:center}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib.danger{color:var(--bad)}
.inp{width:100%;min-width:0;min-height:48px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;font-weight:700;outline:none}
.inp:focus{border-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:10px 2px}
.flag{width:36px;height:27px;object-fit:contain;flex:none}
.mono{width:36px;height:27px;flex:none;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff}

/* ═════════════ Stats ═════════════ */
.filters{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 8px}
.chip{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:48px;background:var(--surface);border-radius:14px;padding:4px 14px;text-align:left}
.chip small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b::after{content:" ▾";color:var(--muted);font-size:12px}
.status{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:0 16px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pill{border-radius:99px;padding:1px 8px;border:1px solid var(--line);font-size:11.5px}
.pill.warn{color:var(--bad);border-color:var(--bad)} .pill.ok{color:var(--good);border-color:var(--good)}
.thead{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:var(--cols);gap:4px;padding:4px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.th{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:0;padding:6px 6px;border-radius:10px;text-align:right}
.th small{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.th span{font-size:12.5px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th.on{background:var(--tint)} .th.on small,.th.on span{color:var(--accent)}
.th.civh{align-items:flex-start;text-align:left}
.skey{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 10px;border-radius:10px;background:var(--surface);font-size:13px;font-weight:800}
.skey em{font-style:normal;color:var(--accent)}
.crow{display:grid;grid-template-columns:var(--cols);gap:4px;align-items:center;padding:7px 10px;min-height:64px;border-bottom:1px solid var(--line);cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s,opacity .2s}
.crow.press,.crow:active{background:var(--surface)}
.crow.off{opacity:.4}
.crow .civ{display:flex;align-items:center;gap:10px;min-width:0}
.crow .nm{min-width:0;font-weight:800;font-size:15.5px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow.off .nm{text-decoration:line-through}
.bc{flex:none;font-size:11px;font-weight:800;background:var(--tint);color:var(--accent);border-radius:99px;padding:2px 7px}
.sc{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:0;align-self:stretch;padding:0 6px;border-radius:10px}
.sc.on{background:var(--tint)}
.sc b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc b.na{color:var(--muted);font-weight:700}
.sc small{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hdiv{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hdiv button{color:var(--accent);font-weight:800;text-transform:none;letter-spacing:0;font-size:13px;padding:6px 0}
.banner{margin:12px;padding:12px 14px;border:1px solid var(--bad);border-radius:14px;color:var(--bad);font-size:14px}
.foot{padding:16px 16px 28px;color:var(--muted);font-size:12.5px;line-height:1.5}
.foot a{color:var(--muted)}
@media (max-width:380px){
  :root{--cols:minmax(0,1fr) repeat(3,clamp(60px,18.5vw,72px))}
  .crow{padding:6px 8px} .thead{padding:4px 8px}
  .crow .nm{font-size:14px} .crow .civ{gap:8px}
  .flag,.mono{width:30px;height:23px}
  .sc b{font-size:16px} .sc{padding:0 4px}
  .seg button{padding:0 12px}
}

/* ═════════════ Builds list ═════════════ */
.pad{padding:4px 12px 24px}
.civhead{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:14px;text-align:left}
.civhead .flag,.civhead .mono{width:56px;height:42px}
.civhead .cn{font-size:21px;font-weight:800}
.civhead .sub{font-size:13px;color:var(--muted);font-weight:600}
.civhead .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:20px;font-weight:800}
.recbar{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;font-weight:700}
.recbar small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:100%}
.recbar .rv{font-size:15px} .recbar .rv b{font-size:18px} .recbar .rv em{font-style:normal;color:var(--muted);font-size:13px}
.recbar .grow{flex:1}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
.bcard{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:0 14px 0 0;margin-bottom:8px;min-height:68px;text-align:left;overflow:hidden}
.bcard .sw{align-self:stretch;width:10px;flex:none}
.bcard .bt{flex:1;min-width:0}
.bcard .bn{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bs{font-size:13px;color:var(--muted);font-weight:600}
.add{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);font-weight:800;font-size:16px}
.add:active{border-color:var(--accent);color:var(--accent)}
.add.sm{min-height:44px;font-size:15px;border-radius:12px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--surface);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:12px}

/* ═════════════ Player ═════════════ */
.pbar{background:var(--bc,#ffe600);color:var(--ink,#000)}
.pbar .icon,.pbar .btn{background:rgba(0,0,0,.16);color:inherit}
.pbar .ttl{flex:1;min-width:0}
.pbar .t1{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .t2{font-size:13px;font-weight:700;opacity:.75}
#pBody{position:relative}
.wheel{padding:34vh 0 22vh}
.ps{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px 14px 12px 10px;border-left:4px solid transparent;opacity:.5;transition:opacity .2s,background .2s;cursor:pointer}
.ps.past{opacity:.28}
.ps.cur{opacity:1;background:var(--tint);border-left-color:var(--accent);padding-top:18px;padding-bottom:18px}
.pn{font-weight:800;color:var(--muted);font-size:14px;text-align:right;padding-top:3px}
.pc{min-width:0}
.ps.br .pc{border-left:3px solid var(--line);padding-left:12px}
.btag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:3px}
.ptx{font-size:18px;font-weight:650;line-height:1.32;overflow-wrap:anywhere}
.ps.cur .ptx{font-size:25px;font-weight:800}
.vil{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vb{display:inline-flex;align-items:baseline;gap:4px;padding:3px 9px;border-radius:9px;background:var(--surface2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.vb i{font-style:normal;font-size:.72em;opacity:.85}
.ps.cur .vb{font-size:21px;padding:4px 11px}
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px;margin-top:12px}
.fk{display:block;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-weight:600;-webkit-user-select:none;user-select:none}
.fk.on{border-color:var(--accent);background:var(--tint)}
.fk b{display:block;font-size:18px;font-weight:800}
.fk ol{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted);font-weight:600}
.ps.cur .fk ol{color:var(--text)}
.result{margin:28px 12px 0;padding:16px;background:var(--surface);border-radius:20px}
.result h3{margin:0;font-size:18px}
.modechip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:36px;padding:0 12px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted)}
.modechip b{color:var(--text)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rbtns .btn{min-height:58px;font-size:17px;font-weight:800}
.rbtns .win{background:var(--good);color:#04140c}
.rbtns .loss{background:var(--bad);color:#1c0505}
.rbtns .skip{grid-column:1/-1;min-height:48px;font-size:16px}
.rsub{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--muted)}

/* rich step text: each line is a block, so wrapped lines stay aligned with their indent */
.ln{padding-left:var(--in,0)}
.ln.bu{position:relative;padding-left:calc(var(--in,0em) + 1.05em)}
.ln .bd{position:absolute;left:var(--in,0)}
.kw{text-decoration-thickness:2px;text-underline-offset:3px}

/* ═════════════ Editor ═════════════ */
.ed{padding:12px 12px 28px}
.ecard{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-bottom:16px}
.erow{display:flex;flex-wrap:wrap;gap:8px}
.erow .btn{flex:1 1 130px}
.erow .flag,.erow .mono{width:28px;height:21px}
.swd{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none}
.es{background:var(--surface);border-radius:var(--r);padding:10px;margin-bottom:10px;display:grid;gap:8px;min-width:0}
.es.opt{border:2px solid var(--accent)}
.esh{display:flex;align-items:center;gap:6px}
.esh .n{font-weight:800;color:var(--muted);font-size:15px;min-width:30px}
.esh .grow{flex:1}
.ta{display:block;width:100%;min-width:0;resize:none;overflow:hidden;min-height:48px;outline:none;margin:0}
.ta:focus{border-color:var(--accent)}
.tw{position:relative;min-width:0}
.tw .hl,.tw .ta{font-size:17px;font-weight:600;line-height:1.35;padding:10px 12px;border:1.5px solid transparent;border-radius:12px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;letter-spacing:normal}
.tw .hl{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:var(--text)}
.tw .ta{position:relative;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text);border-color:var(--line)}
.tw .ta::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted)}
.tw .ta::selection{background:rgba(120,160,255,.35)}
.tw .mt{opacity:.45}
.ta-bg{position:absolute;inset:0;border-radius:12px;background:var(--bg)}
.oc .ta-bg{background:var(--surface)}
.vin{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.vi{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.vi input{width:100%;min-width:0;height:44px;text-align:center;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;font-size:18px;font-weight:800;color:inherit;outline:none}
.vi input:focus{border-color:var(--accent)}
.ogrid{display:grid;gap:8px}
.oc{border:2px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:8px;display:grid;gap:8px;min-width:0}
.oc .es{background:var(--surface2);margin:0}
.oc .vi input{background:var(--surface)}
.oh{display:flex;align-items:center;gap:8px}
.oh .lt{font-weight:900;color:var(--accent);font-size:18px;width:22px;text-align:center}
.oh .inp{min-height:42px;font-size:16px}
.tip{color:var(--muted);font-size:13px;line-height:1.5;margin:14px 4px 0}

/* style bar (editor only): indent tools + your words */
#styleBar{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line);max-height:34vh;overflow-y:auto}
body.kb #styleBar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:50;max-width:760px;margin:0 auto}
body.kb .tabs{display:none}
.sb{height:40px;min-width:44px;padding:0 10px;border-radius:11px;background:var(--surface2);font-weight:800;font-size:17px}
.sb.plus{color:var(--accent)}
.sb,.wchip{flex:none}
.vsep{width:1px;height:28px;background:var(--line);margin:0 2px}
.wchip{display:inline-flex;height:40px;border-radius:11px;background:var(--surface2);overflow:hidden}
.wchip .wd{width:34px;display:grid;place-items:center;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;font-size:14px}
.wchip .wl{padding:0 10px;font-weight:800;font-size:16px;text-decoration-thickness:2px;text-underline-offset:3px}
.wchip .wx{padding:0 10px 0 4px;color:var(--muted);font-size:14px}
.tgrp{display:inline-flex;gap:6px;flex:none}

/* ═════════════ Sheets & toasts ═════════════ */
#sheetWrap{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:760px;margin:0 auto;max-height:86%;display:flex;flex-direction:column;background:var(--surface);
  border-radius:22px 22px 0 0;padding:4px 0 calc(env(safe-area-inset-bottom,0px) + 14px);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 2px}
.sh{display:flex;align-items:center;gap:10px;padding:6px 14px 10px 18px}
.sh h2{flex:1;min-width:0;margin:0;font-size:19px;font-weight:800}
.sh .icon{width:38px;height:38px;background:var(--surface2);font-size:16px}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px;min-height:0}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}
.olist{display:grid;gap:2px;margin-top:10px}
.oitem{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:12px;text-align:left;font-weight:700;font-size:16px}
.oitem small{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.oitem[aria-selected="true"]{background:var(--tint);color:var(--accent)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rct{position:sticky;top:0;background:var(--surface);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 10px 6px}
.ropt{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:8px 10px;border-radius:12px;text-align:left;font-weight:800;font-size:15px}
.ropt small{font-size:12px;color:var(--muted);font-weight:600}
.ropt[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)} .ropt[aria-selected="true"] small{color:inherit;opacity:.8}
.ropt.inr{background:var(--tint)}

<noscript>This app needs JavaScript.</noscript>
<div id="app">

  <!-- ═════ Stats ═════ -->
  <section class="view" id="vStats">
    <header class="top">
      <div class="title">AoE<span>4</span> Companion</div>
      <button class="icon" id="btnReload" aria-label="Refresh stats">↻</button>

<script>

  'Platinum I','Platinum II','Platinum III','Diamond I','Diamond II','Diamond III','Conqueror I','Conqueror II','Conqueror III'];

  delhi_sultanate: 'delhi_sultanate-7f92025d0623b8e224533d9f28b9cd7c51a5ff416ef3edaf7cc3e948ee290708',
  english: 'english-8c6c905d0eb11d6d314b9810b2a0b9c09eec69afb38934f55b329df36468daf2',
  french: 'french-aed0afa1c5843ed8a3d123eb8dda03e63c9ea9a4c74a75424b0bcbb5e429704e',
  golden_horde: 'golden_horde-c99fa291c46ddaea1eb73568291c0687d81136044c97ff660a556bef3b56c06d',

  holy_roman_empire: 'holy_roman_empire-fc0be4151234fc9ac8f83e10c83b4befe79f22f7a8f6ec1ff03745d61adddb4c',
  japanese: 'japanese-16a9b5bae87a5494d5a002cf7a2c2c5de5cead128a965cbf3a89eeee8292b997',

  macedonian_dynasty: 'macedonian_dynasty-835dcf7fc5e8a9c7d35c8d441d3954579e63dab02f3960ef033bccd72c4a457e',
  malians: 'malians-edb6f54659da3f9d0c5c51692fd4b0b1619850be429d67dbe9c3a9d53ab17ddd',
  mongols: 'mongols-7ce0478ab2ca1f95d0d879fecaeb94119629538e951002ac6cb936433c575105',
  order_of_the_dragon: 'order_of_the_dragon-cad6fa9212fd59f9b52aaa83b4a6173f07734d38d37200f976bcd46827667424',
  ottomans: 'ottomans-83c752dcbe46ad980f6f65dd719b060f8fa2d0707ab8e2ddb1ae5d468fc019a2',
  rus: 'rus-05a92d16ef88fd9f9c3b2aff69a0158ae27293b2fcdd1baa0339416d5134c109',
  scots: 'scots-846ab3cc817714bee02975a97b60b4991c3e79ee8d8905f6460dcdcd07d4e025',
  sengoku_daimyo: 'sengoku_daimyo-047c5091475909b0e159c08768078cd6811ac7a3d2173ac5f497325b1ec549a0',
  tughlaq_dynasty: 'tughlaq_dynasty-4789aaee7cc51e9a24ff4707136eea14366ca5995772a9ee3bc2ac941c40c9d2',
  vikings: 'vikings-1b22fd2d6bd467d27d25d3664ea6e4734dc97a444b6920e26d3910427e704f2a',
  zhu_xis_legacy: 'zhu_xis_legacy-c4d119a5fc11f2355f41d206a8b65bea8bab2286d09523a81b7d662d1aad0762',
};
const civSlugs = Object.keys(CIVS).sort((a, b) => civName(a).localeCompare(civName(b)));
const FLAG_BASE = 'https://static.aoe4world.com/assets/flags/';

const RES = [['f', 'Food'], ['w', 'Wood'], ['g', 'Gold'], ['s', 'Stone'], ['b', 'Build']]; // villager jobs per step
const BANNER_CYCLE = ['#ffe600', '#2d63c8', '#d83a3a', '#2f9e5b', '#7a4fc9', '#000000'];
const LEGACY_COLORS = { y: '#ffe600', b: '#2d63c8', r: '#d83a3a', g: '#2f9e5b', p: '#7a4fc9', k: '#000000' };
const WORD_CYCLE = ['#7bd88f', '#6cb2ff', '#ff8a65', '#ffd54f', '#ce93d8', '#4dd0e1', '#f48fb1'];
const hslHex = (h, s, l) => { l /= 100; const a = s / 100 * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4); };
const PALETTE = [...[78, 58, 36].flatMap(l => Array.from({ length: 12 }, (_, i) => hslHex(i * 30, 85, l))),
  '#000000', '#3a3f47', '#7b838f', '#c3c8d0', '#ffffff', '#ffe600'];

/* ───────── 2. Storage & state ───────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem('aoe4c.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('aoe4c.' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const isHex = c => /^#[0-9a-f]{6}$/i.test(c || '');
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const letter = k => String.fromCharCode(65 + k);
const inkFor = c => { const n = parseInt(c.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150 ? '#000' : '#fff'; };

const S = Object.assign({ mode: '1v1', min: 12, max: 17, pool: 'ranked', mapId: DEFAULT_MAP.id, scol: 'map', skey: 'wr', sdir: 'desc' }, store.get('settings', {}));
S.min = clamp(+S.min | 0, 0, 17); S.max = clamp(+S.max | 0, S.min, 17);
if (!MODES[S.mode]) S.mode = '1v1';
if (S.pool !== 'all') S.pool = 'ranked';
if (!['all', 'map', 'you'].includes(S.scol)) S.scol = 'map';
if (!['wr', 'g', 'pick'].includes(S.skey)) S.skey = 'wr';
if (S.sdir !== 'asc') S.sdir = 'desc';
delete S.sort;
const saveSettings = () => store.set('settings', S);

let hidden = new Set(store.get('disabled', []));            // civs you hid on the stats list
const saveHidden = () => store.set('disabled', [...hidden]);
let games = store.get('games', []).filter(g => g && CIVS[g.c] && MODES[g.m] && (g.r === 'w' || g.r === 'l')); // { c civ, m mode, r 'w'|'l', t time, b build }
const saveGames = () => store.set('games', games.slice(-20000));
function records(mode) { // civ -> { w, l, n, wr }
  const out = new Map();
  for (const g of games) if (g.m === mode) { const o = out.get(g.c) || { w: 0, l: 0 }; g.r === 'w' ? o.w++ : o.l++; out.set(g.c, o); }
  out.forEach(o => { o.n = o.w + o.l; o.wr = o.n ? o.w / o.n * 100 : null; });
  return out;
}
const recOf = (civ, mode) => records(mode).get(civ) || { w: 0, l: 0, n: 0, wr: null };

/* ───────── 3. Stats data (AoE4World) ───────── */
let cache = store.get('cache', {});
const inflight = {}, failed = new Map();
let refreshing = false, queued = null, lastRefresh = 0, lastManual = 0;
function saveCache() {
  const now = Date.now();
  for (const k of Object.keys(cache)) if (now - cache[k].t > 24 * 3600e3) delete cache[k];
  const keys = Object.keys(cache).sort((a, b) => cache[b].t - cache[a].t);
  keys.slice(150).forEach(k => delete cache[k]);
  if (!store.set('cache', cache)) { keys.slice(40).forEach(k => delete cache[k]); store.set('cache', cache); }
}
async function fetchJSON(url) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
function get(key, loader, force) { // cached GET; on failure keeps the last good copy
  const c = cache[key];
  if (c && !force && Date.now() - c.t < FRESH_MS) return Promise.resolve(c);
  if (inflight[key]) return inflight[key];
  return inflight[key] = (async () => {
    try { const j = await loader(); cache[key] = { t: Date.now(), j }; saveCache(); failed.delete(key); }
    catch (e) { failed.set(key, e.message || String(e)); }
    finally { delete inflight[key]; }
    return cache[key] || null;
  })();
}
const q = r => r ? `?rating=${encodeURIComponent(r)}` : '';
const civUrl = r => `${API}/stats/${MODES[S.mode].stats}/civilizations${q(r)}`;
const mapStatsUrl = (id, r) => `${API}/stats/${MODES[S.mode].stats}/maps/${id}${q(r)}`;
const mapsListUrl = () => `${API}/stats/${MODES[S.mode].stats}/maps`;
const poolKey = () => 'pool:' + S.mode;
function windowInfo() {
  const lo = RANKS[S.min].min, hiEx = RANKS[S.max].max === Infinity ? Infinity : RANKS[S.max].max + 1;
  const used = ATOMS.filter(a => a.lo < hiEx && a.hi > lo);
  const effLo = used[0].lo, effHi = used[used.length - 1].hi;
  let parts = {};
  if (effLo === 0 && effHi === Infinity) parts = { '': 1 };
  else if (effHi === Infinity && OPEN_BUCKET[effLo]) parts = { [OPEN_BUCKET[effLo]]: 1 };
  else for (const a of used) for (const [k, c] of Object.entries(a.parts)) parts[k] = (parts[k] || 0) + c;
  for (const k of Object.keys(parts)) if (!parts[k]) delete parts[k];
  const fmt = (a, b) => b === Infinity ? `${a}+` : `${a}–${b - 1}`;
  return { parts, exact: effLo === lo && effHi === hiEx, label: fmt(effLo, effHi), asked: fmt(lo, hiEx) };
}
function aggregate(urlFor) {
  const { parts } = windowInfo(), acc = new Map(); let oldest = Infinity;
  for (const [r, co] of Object.entries(parts)) {
    const c = cache[urlFor(r)];
    if (!c || !Array.isArray(c.j?.data)) return null;
    oldest = Math.min(oldest, c.t);
    for (const row of c.j.data) {
      const g = row.games_count || 0, pg = row.player_games_count ?? g;
      const w = row.win_count != null ? row.win_count : (row.win_rate != null ? row.win_rate / 100 * g : 0);
      const o = acc.get(row.civilization) || { g: 0, w: 0, pg: 0 };
      o.g += co * g; o.w += co * w; o.pg += co * pg; acc.set(row.civilization, o);
    }
  }
  let tot = 0; acc.forEach(o => { o.g = Math.max(0, o.g); o.w = Math.max(0, o.w); o.pg = Math.max(0, o.pg); tot += o.pg; });
  const civs = new Map();
  acc.forEach((o, k) => civs.set(k, { wr: o.g > 0 ? o.w / o.g * 100 : null, g: Math.round(o.g), pick: tot > 0 ? o.pg / tot * 100 : null }));
  return { civs, t: oldest };
}
async function loadPool(force) { // no pool endpoint: infer it from maps in the latest ranked games
  return get(poolKey(), async () => {
    const lb = MODES[S.mode].games, counts = new Map(); let total = 0;
    const pages = await Promise.all(Array.from({ length: POOL_PAGES }, (_, i) => fetchJSON(`${API}/games?leaderboard=${lb}&per_page=50&page=${i + 1}`)));
    for (const p of pages) for (const g of p.games || []) {
      if (g.map_id == null) continue; total++;
      const c = counts.get(g.map_id) || { id: g.map_id, name: g.map, n: 0 }; c.n++; counts.set(g.map_id, c);
    }
    if (!total) throw new Error('no games returned');
    return { maps: [...counts.values()].filter(m => m.n >= POOL_MIN_N && m.n / total >= POOL_MIN_SHARE), sample: total };
  }, force);
}
const loadMapsList = force => get(mapsListUrl(), () => fetchJSON(mapsListUrl()), force);
function mapOptions() {
  const list = [...(cache[mapsListUrl()]?.j?.data || [])].sort((a, b) => b.games_count - a.games_count);
  if (S.pool === 'all') return { maps: list, warn: null, sample: null };
  const pool = cache[poolKey()]?.j;
  if (!pool) return { maps: list, warn: 'Ranked pool couldn’t be worked out — showing all maps.', sample: null };
  const ids = new Set(pool.maps.map(m => m.id));
  return { maps: list.filter(m => ids.has(m.map_id)), warn: null, sample: pool.sample };
}
function ensureMapSelection() {
  const { maps } = mapOptions();
  if (!maps.length || maps.some(m => m.map_id === S.mapId)) return;

let words = store.get('tags', []);

(function migrateWords() { // older versions: built-in words and a separate "looks" table

      if (!words.some(t => t.name === cap)) words.push({ id: 'c' + k + Date.now().toString(36), name: cap, color: colors[k] || c, u: true, nc: !!looks[k].nc });

/* ───────── 9. Player (in-game) ───────── */
const pos = {}, chosen = {};   // this session only: focused step per build, picked option per choice step

function updateSub(b) { $('#pSub').textContent = route.edit ? `Editing · ${civName(b.civ)}` : `${civName(b.civ)} · step ${(pos[b.id] ?? 0) + 1} of ${seqOf(b).length}`; }

/* ───────── 10. Editor ───────── */

}
function rerenderEditor() { const body = $('#pBody'), y = body.scrollTop; renderPlayer(); if (!focusSel) body.scrollTop = y; else afterEditorRender(); }
function onEditClick(e, b) {

  if (act === 'color') return openColorSheet(b);

    if (s === b.civ) return; if (builds.filter(x => x.civ === s).length >= MAX_BUILDS) return toast(`${civName(s)} already has ${MAX_BUILDS} builds`);
    b.civ = s; saveBuilds(); setCiv(s); rerenderEditor(); toast(`Moved to ${civName(s)}`);
  });
  if (act === 'dup') {
    if (builds.filter(x => x.civ === b.civ).length >= MAX_BUILDS) return toast(`Max ${MAX_BUILDS} builds per civ`);
    const c = normBuild(JSON.parse(JSON.stringify(b))); c.id = uid(); c.name = (b.name + ' (copy)').slice(0, 120);

}
function openColorSheet(b) {
  openSheet({ title: 'Build color', body: `<div class="swg">${PALETTE.map(c => `<button class="swb" data-c="${c}" aria-pressed="${c === b.color}" aria-label="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="cpk"><label>Any color <input type="color" value="${b.color}"></label></div>`,
    onClick: e => { const s = e.target.closest('[data-c]'); if (s) { b.color = s.dataset.c; saveBuilds(); closeSheet(); rerenderEditor(); } } });
  $('input[type=color]', sheetEl).addEventListener('input', e => { b.color = e.target.value; saveBuilds(); const top = $('#pTop'); top.style.setProperty('--bc', b.color); top.style.setProperty('--ink', inkFor(b.color)); $('#pBody .swd').style.background = b.color; });
}

/* style bar: ⇤ ⇥ • · your words (✎ style, tap = apply, ✕ delete) · ＋ */
function renderStyleBar() {
  const chips = words.map(t => `<span class="wchip"><button class="wd" data-style="${t.id}" style="background:var(--t-${t.id})" aria-label="Style ${esc(t.name)}">✎</button><button class="wl" data-wrap="${t.id}" style="${lookCss(t.id)}">${esc(t.name)}</button><button class="wx" data-rmw="${t.id}" aria-label="Delete ${esc(t.name)}">✕</button></span>`);
  const add = `<button class="sb plus" data-addw aria-label="Add a styled word">＋${words.length ? '' : ' Styled word'}</button>`;
  chips.push(chips.length ? `<span class="tgrp">${chips.pop()}${add}</span>` : add); // ＋ stays right of the last word
  $('#styleBar').innerHTML = `<button class="sb" data-ind="-1" aria-label="Outdent">⇤</button><button class="sb" data-ind="1" aria-label="Indent">⇥</button><button class="sb" data-bul aria-label="Bullet">•</button><span class="vsep"></span>` + chips.join('');
}
function refreshWords() {
  applyWordStyles(); buildWords(); renderStyleBar();
  const b = curBuild();
  if (b && route.edit) $$('#pBody .es').forEach(row => { $(':scope > .tw > .hl', row).innerHTML = hlHtml(ctx(b, row).s.text); });
  else if (b) renderPlayer();
  measureUI();
}
$('#styleBar').addEventListener('mousedown', e => e.preventDefault()); // keep the keyboard and text selection
$('#styleBar').addEventListener('click', e => {
  const q = s => e.target.closest(s);
  if (q('[data-ind]') || q('[data-bul]')) { const ta = lastTA; if (!ta?.isConnected) return toast('Tap into a step first'); return q('[data-bul]') ? toggleBullet(ta) : indentLines(ta, +q('[data-ind]').dataset.ind); }
  if (q('[data-wrap]')) return wrapWord(q('[data-wrap]').dataset.wrap);
  if (q('[data-style]')) return openWordSheet(q('[data-style]').dataset.style);
  if (q('[data-rmw]')) return deleteWord(q('[data-rmw]').dataset.rmw);
  if (q('[data-addw]')) return openAddWord();
});
function deleteWord(id) {
  const i = words.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = words.splice(i, 1); saveWords(); refreshWords();
  toast(`Deleted “${t.name}”`, 'Undo', () => { words.splice(i, 0, t); saveWords(); refreshWords(); });
}
function openAddWord() {
  const submit = () => {
    const name = $('#nw').value.trim().slice(0, 30); if (!name) return;
    if (wordByName.has(name)) return toast(`“${name}” is already a word`);
    const t = { id: 'c' + Date.now().toString(36), name, color: WORD_CYCLE[words.length % WORD_CYCLE.length], u: false, nc: false };
    words.push(t); saveWords(); refreshWords(); openWordSheet(t.id);
  };
  openSheet({ title: 'Add a styled word', body: `<input class="inp" id="nw" maxlength="30" placeholder="e.g. Stone, SURV, boom" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="note">It matches exactly as typed — “Stone” and “stone” are different words, each with its own style.</p><button class="btn pri block" data-ok>Add word</button>`,
    onClick: e => { if (e.target.closest('[data-ok]')) submit(); } });
  const inp = $('#nw'); inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
}
function openWordSheet(id) {
  const t = words.find(x => x.id === id); if (!t) return;
  openSheet({ title: 'Word style', body: `<div class="wprev" style="${lookCss(id)}">${esc(t.name)}</div>
    <div class="looks"><button class="btn" data-look="c">Color</button><button class="btn" data-look="u"><u>Underline</u></button></div>
    <div class="swg">${PALETTE.map(c => `<button class="swb" data-c="${c}" aria-label="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="cpk"><label>Any color <input type="color"></label><input class="inp hex" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Hex color" placeholder="#RRGGBB"></div>
    <div class="two"><button class="btn danger" data-delw>Delete word</button><button class="btn pri" data-close>Done</button></div>`,
    onClick: e => {
      const s = e.target.closest('[data-c]'); if (s) { t.color = s.dataset.c; t.nc = false; return changed(); }
      const lk = e.target.closest('[data-look]'); if (lk) { if (lk.dataset.look === 'u') t.u = !t.u; else t.nc = !t.nc; return changed(); }
      if (e.target.closest('[data-delw]')) { closeSheet(); deleteWord(id); }
    } });
  const wheel = $('input[type=color]', sheetEl), hex = $('.hex', sheetEl);
  const sync = () => {
    $('[data-look="c"]', sheetEl).setAttribute('aria-pressed', !t.nc); $('[data-look="u"]', sheetEl).setAttribute('aria-pressed', t.u);
    $$('.swb', sheetEl).forEach(b => b.setAttribute('aria-pressed', !t.nc && b.dataset.c === t.color));
    if (wheel.value !== t.color) wheel.value = t.color; if (document.activeElement !== hex) hex.value = t.color.toUpperCase();
  };
  const changed = () => { saveWords(); applyWordStyles(); sync(); };
  wheel.addEventListener('input', () => { t.color = wheel.value.toLowerCase(); t.nc = false; changed(); });
  hex.addEventListener('input', () => { let v = hex.value.trim(); if (v && v[0] !== '#') v = '#' + v; if (isHex(v)) { t.color = v.toLowerCase(); t.nc = false; changed(); } });
  sync();
}

/* ───────── 11. Boot ───────── */
function measureUI() { // keeps toasts above the tab bar / style bar
  const tabs = $('#tabs'), bar = $('#styleBar');
  document.documentElement.style.setProperty('--ui-bottom', ((tabs.offsetHeight || 0) + (bar.hidden ? 0 : bar.offsetHeight)) + 'px');
}
new ResizeObserver(measureUI).observe($('#styleBar')); new ResizeObserver(measureUI).observe($('#tabs'));
if (window.visualViewport) { // on-screen keyboard: lift the style bar above it, hide the tab bar
  const vv = window.visualViewport, kb = () => {
    const off = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', off + 'px'); document.body.classList.toggle('kb', off > 80);
  };
  vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb);
}
if (location.hash) history.replaceState(null, '', location.pathname + location.search); // always open on Stats
applyWordStyles(); buildWords(); renderStyleBar();
onRoute();
refresh(false).then(() => { lastRefresh = Date.now(); });
</script>
</body>
