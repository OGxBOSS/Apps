<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AoE4 Companion</title>
<meta name="description" content="Age of Empires IV civilization win rates by rank, map stats and build orders.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0a93b'/%3E%3Cpath d='M8 22l10-10 3 3-10 10z M16 8l8 0 0 3-3 3-5-3z' fill='%230f1318'/%3E%3C/svg%3E">
<style>
/* ============================== Tokens ============================== */
:root{
  --bg:#0e1217; --panel:#161b22; --panel2:#1c232c; --line:#27303b; --line2:#323d4a;
  --text:#e7eaef; --muted:#8994a4; --accent:#e3ab3a; --accent-ink:#1b1405;
  --prim:rgba(227,171,58,.07); --sec:rgba(88,166,255,.07); --sec-ink:#6cb2ff;
  --good:#4cc38a; --bad:#ef6b6b; --wl:62%; --shadow:0 10px 30px rgba(0,0,0,.45);
  --food:#e06a62; --wood:#b98b57; --gold:#e6c44f; --stone:#98a2af;
  --rowh:42px; --civw:minmax(120px,1.15fr);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7; --line2:#c9cfd8;
    --text:#161a20; --muted:#667182; --accent:#b97d0a; --accent-ink:#fff;
    --prim:rgba(185,125,10,.07); --sec:rgba(30,110,200,.07); --sec-ink:#1c6cc4;
    --good:#13895a; --bad:#c93a3a; --wl:36%; --shadow:0 10px 30px rgba(0,0,0,.15);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
body{padding-bottom:var(--dock,64px)} /* ADJUSTABLE - fallback height of the fixed bottom panel */
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;fill:currentColor;vertical-align:-.125em}

/* ============================== Shared controls ============================== */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--line2)}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.btn b{font-weight:600}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{background:transparent;border:0;border-radius:6px;padding:5px 10px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;max-height:min(62vh,440px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);z-index:60;padding:4px}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border:0;border-radius:6px;padding:7px 10px;text-align:left;color:var(--text);font-weight:400}
.menu button:hover:not(:disabled){background:var(--panel2)}
.menu button[aria-selected="true"]{background:var(--prim);color:var(--accent);font-weight:600}
.menu button:disabled{opacity:.35;cursor:not-allowed}
.menu .r{color:var(--muted);font-variant-numeric:tabular-nums}
.menu .note{padding:6px 10px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:4px}
.menu .grp{padding:6px 10px 2px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}

/* ============================== Dashboard ============================== */
.sticky{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px 8px;max-width:980px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
.brand span{color:var(--accent)}
.bar .spacer{flex:1}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .bar{padding:8px 10px}
.dock .menu{top:auto;bottom:calc(100% + 6px)}
.status{max-width:980px;margin:0 auto;padding:0 12px 8px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.status .pill{border-radius:99px;padding:1px 8px;border:1px solid var(--line2);font-size:11px}
.status .warn{color:var(--bad);border-color:var(--bad)}
.status .ok{color:var(--good);border-color:var(--good)}
.status button{padding:0 6px;border:0;background:none;color:var(--muted)}
.status button:hover{color:var(--text)}
.wrap{max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:var(--civw) 1fr 1fr;align-items:stretch}
.grp3{display:grid;grid-template-columns:1.05fr 1fr .9fr;align-items:center;text-align:right}
.head{border-top:0}
.head .c{padding:6px 8px}
.head .civ{display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.head .civ .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.head .g{border-left:1px solid var(--line)}
.head .g.p{background:var(--prim)} .head .g.s{background:var(--sec)}
.head .gt{display:flex;align-items:center;min-height:30px;font-weight:600;font-size:13px;gap:6px}
.head .g.p .gt{color:var(--accent)} .head .g.s .gt{color:var(--sec-ink)}
.head .gt .btn{padding:3px 8px;font-size:13px;font-weight:600;max-width:100%;overflow:hidden}
.head .gt .btn span{overflow:hidden;text-overflow:ellipsis}
.head .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.sub button{background:none;border:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:4px 0;text-align:right;white-space:nowrap}
.sub button.on{color:var(--text);font-weight:700}
.togglebtn{width:100%;justify-content:center;font-size:12px;padding:5px 6px;white-space:normal;text-align:center}
.row{display:grid;grid-template-columns:var(--civw) 1fr 1fr;min-height:var(--rowh);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:opacity .15s,background .15s}
.row:hover{background:var(--panel)}
.row>div{padding:4px 8px;display:flex;align-items:center}
.row .civcell{gap:8px;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.flag{width:24px;height:16px;object-fit:cover;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(128,128,128,.35)}
.mono{width:24px;height:16px;border-radius:3px;flex:none;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;letter-spacing:.02em}
.hammer{flex:none;width:28px;height:28px;display:inline-grid;place-items:center;padding:0;border-radius:7px;background:transparent;border:1px solid transparent;color:var(--muted)}
.hammer:hover{color:var(--accent);border-color:var(--line2);background:var(--panel2)}
.row .g{border-left:1px solid var(--line);align-items:center}
.row .g.p{background:var(--prim)} .row .g.s{background:var(--sec)}
.row .g .grp3{width:100%}
.row .wr{font-weight:700;font-size:15px}
.row .gm,.row .pk{color:var(--muted)}
.row.off{opacity:.42}
.row.off .nm{text-decoration:line-through;text-decoration-color:rgba(128,128,128,.6)}
.row.off:hover{opacity:.7}
.divider{padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line)}
.banner{margin:12px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;color:var(--bad);background:rgba(239,107,107,.07)}
.foot{padding:16px 12px 40px;color:var(--muted);font-size:12px;max-width:980px;margin:0 auto}
.foot a{color:var(--muted)}
@media (max-width:640px){
  :root{--civw:128px;--rowh:46px}
  html,body{font-size:13px}
  .brand{display:none}
  .bar{padding:8px 8px 6px;gap:6px}
  .bar .spacer{display:none}
  .seg button{padding:5px 8px}
  .btn{padding:6px 8px}
  .head .c{padding:5px 5px}
  .row>div{padding:3px 5px}
  .row .civcell{gap:5px}
  .row .nm{font-size:11.5px;white-space:normal;line-height:1.1;text-overflow:clip;overflow-wrap:anywhere}  .flag,.mono{width:20px;height:14px}
  .hammer{width:24px;height:24px}
  .row .wr{font-size:13px}
  .row .gm,.row .pk{font-size:11px}
  .head .sub{font-size:9.5px;letter-spacing:0}
  .head .gt{font-size:11.5px;min-height:28px}
  .head .gt .btn{font-size:11.5px;padding:3px 5px}
  .head .civ .t{display:none}
  .status{padding:0 8px 6px}
  .btn#btnCreate .tx{display:none}
}

/* ============================== Build orders ============================== */
:root{--vw:28px;--bld:#f0a040;--age:#35d0e0} /* ADJUSTABLE - --vw: width of each villager column */
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--gold:#a8820a;--wood:#8a5a1f;--stone:#5d6773;--food:#c4443c;--bld:#c26a00;--age:#0a8a99}}
.bhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:40;flex-wrap:wrap}
.bhead h1{font-size:16px;margin:0;flex:1;min-width:120px}
.blayout{display:grid;grid-template-columns:210px 1fr;max-width:1100px;margin:0 auto;min-height:calc(100vh - 56px)}
.civlist{border-right:1px solid var(--line);padding:8px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;align-self:start}
.civlist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px}
.civlist button:hover{background:var(--panel)}
.civlist button[aria-current="true"]{background:var(--prim);color:var(--accent);font-weight:600}
.civlist .cnt{margin-left:auto;color:var(--muted);font-size:11px;background:var(--panel2);border-radius:99px;padding:0 7px}
.bmain{padding:12px 12px 90px;min-width:0}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:700px){
  .blayout{grid-template-columns:1fr}
  .civlist{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .civlist button{width:auto;flex:none;border:1px solid var(--line);white-space:nowrap}
}
/* resource / keyword colors (shared by text, villager columns and toolbar) */
.k-f{color:var(--food)} .k-w{color:var(--wood)} .k-g{color:var(--gold)} .k-s{color:var(--stone)}
.k-b{color:var(--bld)} .k-a{color:var(--age);font-weight:700} .k-x{color:var(--bad);font-weight:700}
.tx .k-b,.pv .k-b{text-decoration:underline}
/* build sheet */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.bn{padding:8px 12px;font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.15} /* ADJUSTABLE - banner title size */
.bname{width:100%;background:transparent;color:inherit;border:1px dashed currentColor;border-radius:6px;font:inherit;padding:2px 6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--text)}
.tools select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.vh,.vl{display:grid;grid-template-columns:repeat(5,var(--vw));text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.vh{justify-content:end;padding:3px 10px 3px 0;font-size:11px;border-bottom:1px solid var(--line)}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;padding:9px 10px;border-bottom:1px solid var(--line);align-items:start}
.st:not(.ed){cursor:pointer}
.st.cur{box-shadow:inset 3px 0 var(--accent);background:var(--prim)}
.st.done{opacity:.4}
.st.done .tx{text-decoration:line-through}
.sn{color:var(--muted);font-size:12px;padding-top:3px}
.tx{white-space:pre-wrap;font-size:16px;font-weight:600;overflow-wrap:anywhere} /* ADJUSTABLE - step text size */
.vl .e{opacity:.25}
.st.ed{grid-template-columns:22px 1fr}
.st.ed .pv,.st.ed .vl,.st.ed .sa{grid-column:2}
.st.ed .vl{grid-template-columns:repeat(5,1fr);gap:4px;max-width:260px}
.st textarea{width:100%;resize:none;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px}
.vl input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;font-weight:700}
.pv{white-space:pre-wrap;font-size:15px;font-weight:600} .pv:empty{display:none}
.sa{display:flex;gap:4px}
.add{display:block;width:100%;background:none;border:1px dashed var(--line2);border-radius:10px;padding:12px;color:var(--muted);font-weight:600}
.add:hover{color:var(--accent);border-color:var(--accent)}
.add.in{border:0;border-radius:0;padding:10px}
.fmt{position:fixed;left:0;right:0;bottom:var(--dock,64px);display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line2);z-index:50}
.fmt .hint{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;flex:none}
.fmt .btn{flex:none}
.toast{position:fixed;left:50%;bottom:calc(var(--dock,64px) + 12px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);z-index:200}
/* ── wheel (execution view), id box, color popup, options editor ── */
.wheel{position:relative;overflow-y:auto;max-height:var(--wheelh,52vh);padding:var(--wpad,16vh) 0;scrollbar-width:thin} /* ADJUSTABLE - wheel height and end padding */
.wheel .st{opacity:.5;transition:opacity .25s,background .25s}
.wheel .st.past{opacity:.28}
.wheel .st .tx{font-size:14px}
.wheel .st.cur{opacity:1;padding:16px 10px;background:var(--prim);box-shadow:inset 4px 0 var(--accent)}
.wheel .st.cur .tx{font-size:24px;font-weight:800} /* ADJUSTABLE - focused step text size */
.wheel .st.cur .vl{font-size:20px}
.wheel .st.br{padding-left:22px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.chosen{font-size:12px;color:var(--muted);font-weight:500}
.obtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.obtn .btn{flex:1 1 0;min-width:0;min-height:54px;justify-content:center;font-size:16px;font-weight:700;white-space:normal;text-align:center}
.obtn.many .btn{flex:1 1 40%}
.bn{border-radius:9px 9px 0 0}
.idbox{display:flex;height:38px;border:1px solid currentColor;border-radius:8px;overflow:hidden}
.idbox select,.idbox input{height:100%;background:transparent;color:inherit;border:0;border-radius:0;font:inherit;font-size:15px;font-weight:700;padding:0 8px;min-width:0}
.idbox select{border-right:1px solid currentColor;max-width:45%}
.idbox select option{color:#000}
.idbox input{flex:1}
.tools{position:relative}
.tools .grow{flex:1}
.sw0{width:30px;height:30px;border-radius:50%;border:2px solid var(--text);padding:0}
.pal{position:absolute;top:100%;left:8px;z-index:30;display:grid;grid-template-columns:repeat(7,30px);gap:6px;padding:10px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow)}
.pal button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);padding:0}
.st.ed .ob{grid-column:2;margin-top:6px}
.oc{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;margin-bottom:8px;padding:6px 0}
.oh{display:flex;gap:6px;align-items:center;padding:0 8px 4px}
.oh .lt{font-weight:800;color:var(--accent)}
.oname{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700}
.oc .st{border-bottom:0;padding:6px 8px}
</style>
</head>
<body>
<noscript>This app needs JavaScript.</noscript>

<!-- ============================== Dashboard view ============================== -->
<main id="viewDash">
  <div class="sticky">
    <div class="dock"><header class="bar">
      <div class="brand">AoE<span>4</span> Companion</div>
      <div class="seg" id="segMode" role="group" aria-label="Game mode">
        <button data-v="1v1" aria-pressed="true">1v1</button>
        <button data-v="team" aria-pressed="false">Team Games</button>
      </div>
      <div class="dd" id="ddMin"><button class="btn" id="btnMin" aria-haspopup="listbox" aria-expanded="false"><span class="lbl">Min</span><b></b></button><div class="menu" role="listbox" hidden></div></div>
      <div class="dd" id="ddMax"><button class="btn" id="btnMax" aria-haspopup="listbox" aria-expanded="false"><span class="lbl">Max</span><b></b></button><div class="menu" role="listbox" hidden></div></div>
      <div class="seg" id="segPool" role="group" aria-label="Map pool">
        <button data-v="ranked" aria-pressed="true">Ranked Maps</button>
        <button data-v="all" aria-pressed="false">All Maps</button>
      </div>
      <span class="spacer"></span>
      <button class="btn accent" id="btnCreate" title="Create a build order"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 19.2 11 10.7l2.3 2.3-8.5 8.5a1.6 1.6 0 0 1-2.3 0 1.6 1.6 0 0 1 0-2.3zM14 2l8 3.2-2 2.2-1.7-.7-1.4 1.4 1 1-2.4 2.4-1-1-1.2 1.2-2.7-2.7 1.2-1.2-1-1L14 6.4l1 1 1.4-1.4L14 4.6z"/></svg><span class="tx">Create Build</span></button>
    </header></div>
    <div class="status" id="status"></div>
    <div class="wrap"><div class="grid head" id="head"></div></div>
  </div>
  <div class="wrap" id="rows"></div>
  <div class="foot" id="foot"></div>
</main>

<!-- ============================== Build-order view ============================== -->
<main id="viewBuilds" hidden>
  <div class="bhead"><h1 id="bTitle">Build Orders</h1></div>
  <div class="dock"><div class="bar">
    <button class="btn" id="bBack">← Stats</button>
    <span class="spacer"></span>
    <button class="btn" id="bEdit">Edit</button>
    <button class="btn" id="bImport" title="Import builds from a JSON file">Import</button>
    <button class="btn" id="bExport" title="Export all builds to a JSON file">Export</button>
    <input type="file" id="bFile" accept="application/json,.json" hidden>
  </div></div>
  <div class="blayout">
    <nav class="civlist" id="civList" aria-label="Civilizations"></nav>
    <section class="bmain" id="bMain"></section>
  </div>
</main>
<div class="fmt" id="fmt" hidden></div>

<script>
"use strict";
/* =====================================================================
 *  AoE4 Companion — single-file app (HTML + CSS + JS, no dependencies)
 *  Data: AoE4World public API (https://aoe4world.com/api)
 *  Sections: 1 Config · 2 Storage · 3 Data layer · 4 Dashboard · 5 Builds
 * ===================================================================== */

/* ---------- 1. Config ---------- */
const API = 'https://aoe4world.com/api/v0';
const MODES = {
  '1v1':  { stats: 'rm_solo', games: 'rm_solo', label: '1v1 Ranked' },
  'team': { stats: 'rm_2v2',  games: 'rm_team', label: 'Team Ranked (2v2)' },
};
const FRESH_MS   = 55 * 60e3;   // cache considered fresh (no refetch)
const REFRESH_MS = 60 * 60e3;   // auto-refresh interval while the app is open
const STALE_MS   = 100 * 60e3;  // older than this => "may be outdated"
const POOL_PAGES = 3, POOL_MIN_SHARE = 0.02, POOL_MIN_N = 3;

// Ranked tiers (Season Points / rating). Source: official "Ranked Season Updates" tier table.
const RANK_NAMES = ['Bronze I','Bronze II','Bronze III','Silver I','Silver II','Silver III','Gold I','Gold II','Gold III',
  'Platinum I','Platinum II','Platinum III','Diamond I','Diamond II','Diamond III','Conqueror I','Conqueror II','Conqueror III'];
const RANK_MIN = [0,400,450,500,600,650,700,800,900,1000,1100,1150,1200,1300,1350,1400,1500,1600];
const RANKS = RANK_NAMES.map((name, i) => ({ name, min: RANK_MIN[i], max: i < 17 ? RANK_MIN[i + 1] - 1 : Infinity }));
const rankRange = r => r.max === Infinity ? `${r.min}+` : `${r.min}–${r.max}`;

/* AoE4World only serves fixed rating buckets (<499, 500-699, 700-999, 1000-1199, 1200-1399, >700, >1000,
 * >1200, >1400, >1700). Any selected range is therefore built from "atoms" aligned to those edges; atom
 * counts are summed (and ">1400" − ">1700" gives 1400–1699). */
const ATOMS = [
  { lo: 0,    hi: 500,      parts: { '<499': 1 } },
  { lo: 500,  hi: 700,      parts: { '500-699': 1 } },
  { lo: 700,  hi: 1000,     parts: { '700-999': 1 } },
  { lo: 1000, hi: 1200,     parts: { '1000-1199': 1 } },
  { lo: 1200, hi: 1400,     parts: { '1200-1399': 1 } },
  { lo: 1400, hi: 1700,     parts: { '>1400': 1, '>1700': -1 } },
  { lo: 1700, hi: Infinity, parts: { '>1700': 1 } },
];
const OPEN_BUCKET = { 700: '>700', 1000: '>1000', 1200: '>1200', 1400: '>1400', 1700: '>1700' };

const CIVS = { // slug -> [display name, flag code | null]
  abbasid_dynasty:['Abbasid Dynasty',null], ayyubids:['Ayyubids','eg'], byzantines:['Byzantines','gr'], chinese:['Chinese','cn'],
  delhi_sultanate:['Delhi Sultanate','in'], english:['English','gb-eng'], french:['French','fr'], golden_horde:['Golden Horde',null],
  holy_roman_empire:['Holy Roman Empire','de'], house_of_lancaster:['House of Lancaster','gb-eng'], japanese:['Japanese','jp'],
  jeanne_darc:["Jeanne d'Arc",'fr'], jin_dynasty:['Jin Dynasty',null], knights_templar:['Knights Templar',null],
  macedonian_dynasty:['Macedonian Dynasty','gr'], malians:['Malians','ml'], mongols:['Mongols','mn'], order_of_the_dragon:['Order of the Dragon','hu'],
  ottomans:['Ottomans','tr'], rus:['Rus','ru'], sengoku_daimyo:['Sengoku Daimyo','jp'], tughlaq_dynasty:['Tughlaq Dynasty','in'],
  zhu_xis_legacy:["Zhu Xi's Legacy",'cn'],
  vikings:['Vikings',null], scots:['Scots','gb-sct'],
};
const civName = s => CIVS[s]?.[0] || s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
const DEFAULT_MAP = { id: 163361, name: 'Dry Arabia' };

/* ---------- 2. Storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('aoe4c.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('aoe4c.' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const S = Object.assign({ mode: '1v1', min: 12, max: 17, pool: 'ranked', sort: 'total', skey: 'wr', sdir: 'desc', scol: 'p', mapId: DEFAULT_MAP.id }, store.get('settings', {}));
S.min = Math.min(Math.max(+S.min | 0, 0), 17); S.max = Math.min(Math.max(+S.max | 0, S.min), 17);
if (!MODES[S.mode]) S.mode = '1v1';
if (!['wr', 'g', 'pick'].includes(S.skey)) S.skey = 'wr';
if (S.sdir !== 'asc') S.sdir = 'desc';
if (S.scol !== 's') S.scol = 'p';
const saveSettings = () => store.set('settings', S);
let disabled = new Set(store.get('disabled', []));
const saveDisabled = () => store.set('disabled', [...disabled]);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));

/* ---------- 3. Data layer ---------- */
let cache = store.get('cache', {});         // url -> { t, j }
const inflight = {}, failed = new Map();
let refreshing = false, lastRefresh = 0, lastManual = 0;

function saveCache() {
  const now = Date.now();
  for (const k of Object.keys(cache)) if (now - cache[k].t > 24 * 3600e3) delete cache[k];
  const keys = Object.keys(cache).sort((a, b) => cache[b].t - cache[a].t);
  keys.slice(150).forEach(k => delete cache[k]);
  if (!store.set('cache', cache)) { keys.slice(40).forEach(k => delete cache[k]); store.set('cache', cache); }
}
async function fetchJSON(url) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
/** Cached GET: reuses fresh cache, otherwise fetches; on failure keeps whatever was cached before. */
function get(key, loader, force) {
  const c = cache[key];
  if (c && !force && Date.now() - c.t < FRESH_MS) return Promise.resolve(c);
  if (inflight[key]) return inflight[key];
  return inflight[key] = (async () => {
    try { const j = await loader(); cache[key] = { t: Date.now(), j }; saveCache(); failed.delete(key); }
    catch (e) { failed.set(key, e.message || String(e)); }
    finally { delete inflight[key]; }
    return cache[key] || null;
  })();
}
const q = r => r ? `?rating=${encodeURIComponent(r)}` : '';
const civUrl = r => `${API}/stats/${MODES[S.mode].stats}/civilizations${q(r)}`;
const mapStatsUrl = (id, r) => `${API}/stats/${MODES[S.mode].stats}/maps/${id}${q(r)}`;
const mapsListUrl = () => `${API}/stats/${MODES[S.mode].stats}/maps`;
const poolKey = () => 'pool:' + S.mode;

/** Selected rank range -> data window (snapped outward to API bucket edges) + the requests it needs. */
function windowInfo() {
  const lo = RANKS[S.min].min, hiEx = RANKS[S.max].max === Infinity ? Infinity : RANKS[S.max].max + 1;
  const used = ATOMS.filter(a => a.lo < hiEx && a.hi > lo);
  const effLo = used[0].lo, effHi = used[used.length - 1].hi;
  let parts = {};
  if (effLo === 0 && effHi === Infinity) parts = { '': 1 };
  else if (effHi === Infinity && OPEN_BUCKET[effLo]) parts = { [OPEN_BUCKET[effLo]]: 1 };
  else for (const a of used) for (const [k, c] of Object.entries(a.parts)) parts[k] = (parts[k] || 0) + c;
  for (const k of Object.keys(parts)) if (!parts[k]) delete parts[k];
  const exact = effLo === lo && effHi === hiEx;
  const fmt = (a, b) => b === Infinity ? `${a}+` : `${a}–${b - 1}`;
  return { parts, effLo, effHi, exact, label: fmt(effLo, effHi), asked: fmt(lo, hiEx) };
}

/** Sum the cached pieces of a window into per-civ totals. Returns null if any piece is missing. */
function aggregate(urlFor) {
  const { parts } = windowInfo();
  const acc = new Map(); let oldest = Infinity;
  for (const [r, co] of Object.entries(parts)) {
    const c = cache[urlFor(r)];
    if (!c || !Array.isArray(c.j?.data)) return null;
    oldest = Math.min(oldest, c.t);
    for (const row of c.j.data) {
      const g = row.games_count || 0, pg = row.player_games_count ?? g;
      const w = row.win_count != null ? row.win_count : (row.win_rate != null ? row.win_rate / 100 * g : 0);
      const o = acc.get(row.civilization) || { g: 0, w: 0, pg: 0 };
      o.g += co * g; o.w += co * w; o.pg += co * pg; acc.set(row.civilization, o);
    }
  }
  let tot = 0; acc.forEach(o => { o.g = Math.max(0, o.g); o.w = Math.max(0, o.w); o.pg = Math.max(0, o.pg); tot += o.pg; });
  const out = new Map();
  acc.forEach((o, k) => out.set(k, { wr: o.g > 0 ? o.w / o.g * 100 : null, g: Math.round(o.g), pick: tot > 0 ? o.pg / tot * 100 : null }));
  return { civs: out, t: oldest };
}

/** Ranked pool: the API has no pool endpoint, so infer it from maps seen in the most recent ranked games. */
async function loadPool(force) {
  return get(poolKey(), async () => {
    const lb = MODES[S.mode].games, counts = new Map(); let total = 0;
    const pages = await Promise.all(Array.from({ length: POOL_PAGES }, (_, i) =>
      fetchJSON(`${API}/games?leaderboard=${lb}&per_page=50&page=${i + 1}`)));
    for (const p of pages) for (const g of p.games || []) {
      if (g.map_id == null) continue; total++;
      const c = counts.get(g.map_id) || { id: g.map_id, name: g.map, n: 0 }; c.n++; counts.set(g.map_id, c);
    }
    if (!total) throw new Error('no games returned');
    const maps = [...counts.values()].filter(m => m.n >= POOL_MIN_N && m.n / total >= POOL_MIN_SHARE);
    return { maps, sample: total };
  }, force);
}
const loadMapsList = force => get(mapsListUrl(), () => fetchJSON(mapsListUrl()), force);

function mapOptions() {
  const list = [...(cache[mapsListUrl()]?.j?.data || [])].sort((a, b) => b.games_count - a.games_count);
  if (S.pool === 'all') return { maps: list, warn: null, sample: null };
  const pool = cache[poolKey()]?.j;
  if (!pool) return { maps: list, warn: 'Ranked pool could not be determined — showing all maps.', sample: null };
  const ids = new Set(pool.maps.map(m => m.id));
  return { maps: list.filter(m => ids.has(m.map_id)), warn: null, sample: pool.sample };
}
function ensureMapSelection() {
  const { maps } = mapOptions();
  if (!maps.length || maps.some(m => m.map_id === S.mapId)) return;
  S.mapId = (maps.find(m => m.map_id === DEFAULT_MAP.id) || maps[0]).map_id; saveSettings();
}
const mapNameOf = id => (cache[mapsListUrl()]?.j?.data || []).find(m => m.map_id === id)?.map || (id === DEFAULT_MAP.id ? DEFAULT_MAP.name : 'Selected map');

async function refresh(force = false) {
  if (refreshing) return; refreshing = true; render();
  try {
    await Promise.all([loadMapsList(force), loadPool(force)]);
    ensureMapSelection();
    const { parts } = windowInfo(), rs = Object.keys(parts);
    await Promise.all([
      ...rs.map(r => get(civUrl(r), () => fetchJSON(civUrl(r)), force)),
      ...rs.map(r => get(mapStatsUrl(S.mapId, r), () => fetchJSON(mapStatsUrl(S.mapId, r)), force)),
    ]);
    if (force) lastRefresh = Date.now();
  } finally { refreshing = false; render(); }
}
// Hourly refresh while open (only refetches what the current view needs), plus catch-up when the tab wakes up.
setInterval(() => refresh(true), REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastRefresh > REFRESH_MS) refresh(true); });

/* ---------- 4. Dashboard ---------- */
const hammerSvg = '<svg class="i" viewBox="0 0 24 24"><path d="M2.5 19.2 11 10.7l2.3 2.3-8.5 8.5a1.6 1.6 0 0 1-2.3 0 1.6 1.6 0 0 1 0-2.3zM14 2l8 3.2-2 2.2-1.7-.7-1.4 1.4 1 1-2.4 2.4-1-1-1.2 1.2-2.7-2.7 1.2-1.2-1-1L14 6.4l1 1 1.4-1.4L14 4.6z"/></svg>';
const fmtG = n => n == null ? '—' : n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n);
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function flagHtml(slug) {
  const code = CIVS[slug]?.[1], name = civName(slug);
  const mono = `<span class="mono" style="background:hsl(${hue(slug)} 45% 38%)" aria-hidden="true">${esc(name.split(/[\s']+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;
  return code ? `<img class="flag" src="https://flagcdn.com/w40/${code}.png" alt="" loading="lazy" data-slug="${slug}">` : mono;
}
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('flag')) {
    const s = t.dataset.slug, name = civName(s);
    const m = document.createElement('span'); m.className = 'mono'; m.style.background = `hsl(${hue(s)} 45% 38%)`;
    m.textContent = name.split(/[\s']+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); t.replaceWith(m);
  }
}, true);

function cells(st, avail) {
  if (!avail) return `<div class="wr num" style="color:var(--muted)">—</div><div class="gm num">—</div><div class="pk num">—</div>`;
  if (!st || st.wr == null) return `<div class="wr num" style="color:var(--muted)">—</div><div class="gm num">${st ? fmtG(st.g) : '—'}</div><div class="pk num">${st && st.pick != null ? st.pick.toFixed(1) + '%' : '—'}</div>`;
  const h = Math.max(0, Math.min(1, (st.wr - 45) / 10)) * 130;
  return `<div class="wr num" style="color:hsl(${h.toFixed(0)} 62% var(--wl))">${st.wr.toFixed(1)}%</div>` +
         `<div class="gm num" title="${st.g.toLocaleString()} games">${fmtG(st.g)}</div><div class="pk num">${st.pick != null ? st.pick.toFixed(1) + '%' : '—'}</div>`;
}

let open = null; // which dropdown is open: 'min' | 'max' | 'map' | null
function closeMenus() { open = null; document.querySelectorAll('.menu').forEach(m => m.hidden = true); document.querySelectorAll('[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function placeMenu(menu) {
  menu.style.left = '0px'; menu.style.right = 'auto';
  const r = menu.getBoundingClientRect(), over = r.right - (innerWidth - 8);
  if (over > 0) menu.style.left = -over + 'px';
  if (r.left < 8) menu.style.left = (8 - r.left) + 'px';
}
function rankMenu(which) {
  const menu = $(which === 'min' ? '#ddMin .menu' : '#ddMax .menu');
  menu.innerHTML = RANKS.map((r, i) => {
    const bad = which === 'min' ? i > S.max : i < S.min;
    const sel = (which === 'min' ? S.min : S.max) === i;
    return `<button role="option" aria-selected="${sel}" data-i="${i}" ${bad ? 'disabled' : ''}><span>${r.name}</span><span class="r">${rankRange(r)}</span></button>`;
  }).join('');
  const sel = menu.querySelector('[aria-selected="true"]'); if (sel) setTimeout(() => sel.scrollIntoView({ block: 'nearest' }), 0);
}

function render() { renderControls(); renderHead(); renderRows(); renderStatus(); renderFoot(); }

function renderControls() {
  document.querySelectorAll('#segMode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.mode));
  document.querySelectorAll('#segPool button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.pool));
  $('#btnMin b').textContent = RANKS[S.min].name; $('#btnMax b').textContent = RANKS[S.max].name;
  $('#btnMin').title = `Minimum rank (${rankRange(RANKS[S.min])})`; $('#btnMax').title = `Maximum rank (${rankRange(RANKS[S.max])})`;
}

function mapButtonHtml() {
  return `<button class="btn" id="btnMap" aria-haspopup="listbox" aria-expanded="${open === 'map'}" title="Choose map"><span>${esc(mapNameOf(S.mapId))}</span><span aria-hidden="true">▾</span></button>`;
}
function renderHead() {
  const total = S.sort === 'total';
  const mapCol = `<div class="dd" style="max-width:100%">${mapButtonHtml()}<div class="menu" id="mapMenu" role="listbox" hidden></div></div>`;
  const totCol = `<span>Total · all maps</span>`;
  // tappable column labels: sort by that statistic (tap again to flip high/low)
  const sub = col => `<div class="grp3 sub">${[['wr', 'Win'], ['g', 'Games'], ['pick', 'Pick']].map(([k, n]) => {
    const on = S.scol === col && S.skey === k;
    return `<button class="${on ? 'on' : ''}" data-sk="${k}" data-col="${col}" aria-label="Sort by ${n}">${n}${on ? (S.sdir === 'asc' ? ' ▲' : ' ▼') : ''}</button>`;
  }).join('')}</div>`;
  $('#head').innerHTML =
    `<div class="c civ"><div class="t">Civilization</div><button class="btn togglebtn" id="btnSort" title="Swap primary and secondary statistics">⇄ ${total ? 'Win Rate by Map' : 'Total Win Rate'}</button></div>` +
    `<div class="c g p"><div class="gt">${total ? totCol : mapCol}</div>${sub('p')}</div>` +
    `<div class="c g s"><div class="gt">${total ? mapCol : totCol}</div>${sub('s')}</div>`;
  if (open === 'map') openMapMenu(true);
}

function renderRows() {
  const total = aggregate(civUrl), mp = aggregate(r => mapStatsUrl(S.mapId, r));
  const slugs = new Set(Object.keys(CIVS)); total?.civs.forEach((_, k) => slugs.add(k)); mp?.civs.forEach((_, k) => slugs.add(k));
  const byTotal = S.sort === 'total', P = byTotal ? total : mp, Sx = byTotal ? mp : total;
  const src = S.scol === 's' ? Sx : P, dir = S.sdir === 'asc' ? 1 : -1;
  const val = s => src?.civs.get(s)?.[S.skey] ?? null;
  const byStat = (a, b) => { const x = val(a), y = val(b); return x == null || y == null ? (x == null) - (y == null) : (x - y) * dir; }; // missing data always last
  const list = [...slugs].sort((a, b) => (disabled.has(a) - disabled.has(b)) || byStat(a, b) || civName(a).localeCompare(civName(b)));
  const nOff = list.filter(s => disabled.has(s)).length;
  let html = '', divided = false;
  if (!total && !mp && failed.size && !refreshing) html += `<div class="banner">Couldn’t load statistics from AoE4World (${esc([...failed.values()][0])}). Nothing is shown rather than guessing — it will retry automatically.</div>`;
  for (const s of list) {
    if (disabled.has(s) && !divided) { divided = true; html += `<div class="divider">Disabled · ${nOff}</div>`; }
    const off = disabled.has(s), n = civName(s);
    html += `<div class="row${off ? ' off' : ''}" role="button" tabindex="0" aria-pressed="${!off}" data-slug="${s}" title="${off ? 'Click to enable' : 'Click to disable'} ${esc(n)}">` +
      `<div class="civcell">${flagHtml(s)}<span class="nm">${esc(n)}</span><button class="hammer" data-build="${s}" title="Build orders — ${esc(n)}" aria-label="Build orders for ${esc(n)}">${hammerSvg}</button></div>` +
      `<div class="g p"><div class="grp3">${cells(P?.civs.get(s), !!P)}</div></div>` +
      `<div class="g s"><div class="grp3">${cells(Sx?.civs.get(s), !!Sx)}</div></div></div>`;
  }
  $('#rows').innerHTML = html;
}

function renderStatus() {
  const w = windowInfo(), tot = aggregate(civUrl), mp = aggregate(r => mapStatsUrl(S.mapId, r));
  const t = Math.min(tot?.t ?? Infinity, mp?.t ?? Infinity);
  const outdated = isFinite(t) && Date.now() - t > STALE_MS;
  const pieces = [`<span>${MODES[S.mode].label}</span>`,
    `<span title="${w.exact ? '' : `You selected ${w.asked}; AoE4World only offers fixed rating buckets, so the data covers the nearest enclosing range.`}">Rating <b class="num">${w.label}</b>${w.exact ? '' : ' <span class="pill">nearest available</span>'}</span>`];
  if (refreshing) pieces.push('<span class="pill">Updating…</span>');
  else if (!isFinite(t)) pieces.push(failed.size ? '<span class="pill warn">No data</span>' : '<span class="pill">Loading…</span>');
  else pieces.push(`<span class="pill ${outdated || failed.size ? 'warn' : 'ok'}" title="${new Date(t).toLocaleString()}">${outdated || failed.size ? 'May be outdated · ' : 'Updated '}${new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`);
  pieces.push('<button id="btnReload" title="Refresh now" aria-label="Refresh now">↻</button>');
  $('#status').innerHTML = pieces.join('');
}
function renderFoot() {
  $('#foot').innerHTML = 'Stats from <a href="https://aoe4world.com" target="_blank" rel="noopener">AoE4World</a> (ranked games, recalculated daily; refreshed here hourly). ' +
    'Win rate = wins ÷ games; pick rate = share of all player-games. Click a row to dim a civ and move it to the bottom. Unofficial fan tool.';
}

function openMapMenu(keep) {
  const menu = $('#mapMenu'); if (!menu) return;
  const { maps, warn, sample } = mapOptions();
  menu.innerHTML = (maps.length ? maps.map(m => `<button role="option" aria-selected="${m.map_id === S.mapId}" data-map="${m.map_id}"><span>${esc(m.map)}</span><span class="r num">${fmtG(m.games_count)}</span></button>`).join('')
    : `<div class="note">No maps loaded yet.</div>`) +
    (warn ? `<div class="note">${esc(warn)}</div>` : '') +
    (S.pool === 'ranked' && sample ? `<div class="note">Ranked pool inferred from the last ${sample} ranked games. Numbers = total games (all ratings).</div>` : '');
  menu.hidden = false; placeMenu(menu); open = 'map';
  $('#btnMap')?.setAttribute('aria-expanded', 'true');
  if (!keep) menu.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

/* dashboard events */
$('#segMode').onclick = e => { const v = e.target.dataset?.v; if (v && v !== S.mode) { S.mode = v; saveSettings(); closeMenus(); refresh(); } };
$('#segPool').onclick = e => { const v = e.target.dataset?.v; if (v && v !== S.pool) { S.pool = v; saveSettings(); closeMenus(); ensureMapSelection(); refresh(); } };
for (const which of ['min', 'max']) {
  const dd = $(which === 'min' ? '#ddMin' : '#ddMax'), btn = dd.querySelector('button.btn'), menu = dd.querySelector('.menu');
  btn.onclick = e => { e.stopPropagation(); const was = open === which; closeMenus(); if (was) return; rankMenu(which); menu.hidden = false; placeMenu(menu); btn.setAttribute('aria-expanded', 'true'); open = which; };
  menu.onclick = e => {
    const b = e.target.closest('button[data-i]'); if (!b || b.disabled) return;
    S[which] = +b.dataset.i; if (S.min > S.max) { if (which === 'min') S.max = S.min; else S.min = S.max; }
    saveSettings(); closeMenus(); refresh();
  };
}
$('#head').onclick = e => {
  const sk = e.target.closest('[data-sk]');
  if (sk) {
    const same = S.scol === sk.dataset.col && S.skey === sk.dataset.sk;
    S.scol = sk.dataset.col; S.skey = sk.dataset.sk; S.sdir = same && S.sdir === 'desc' ? 'asc' : 'desc';
    saveSettings(); closeMenus(); render(); return;
  }
  if (e.target.closest('#btnSort')) { S.sort = S.sort === 'total' ? 'map' : 'total'; S.scol = 'p'; S.skey = 'wr'; S.sdir = 'desc'; saveSettings(); closeMenus(); render(); return; }
  if (e.target.closest('#btnMap')) { e.stopPropagation(); if (open === 'map') closeMenus(); else { closeMenus(); openMapMenu(); } return; }
  const b = e.target.closest('button[data-map]');
  if (b) { S.mapId = +b.dataset.map; saveSettings(); closeMenus(); render(); refresh(); }
};
function toggleCiv(slug) { disabled.has(slug) ? disabled.delete(slug) : disabled.add(slug); saveDisabled(); renderRows(); }
$('#rows').onclick = e => {
  const h = e.target.closest('[data-build]'); if (h) { e.stopPropagation(); location.hash = '#/builds/' + h.dataset.build; return; }
  const r = e.target.closest('.row'); if (r) toggleCiv(r.dataset.slug);
};
$('#rows').onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) { e.preventDefault(); toggleCiv(e.target.dataset.slug); } };
$('#status').onclick = e => { if (e.target.closest('#btnReload') && Date.now() - lastManual > 30000) { lastManual = Date.now(); refresh(true); } };
$('#btnCreate').onclick = () => { location.hash = '#/builds/new'; };
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

/* ---------- 5. Build orders ---------- */
// ── CONFIG ──
const MAX_BUILDS = 6;   // ADJUSTABLE - max builds per civilization on one screen
const MAX_OPTIONS = 8;  // ADJUSTABLE - max options in one Options Step
const LEGACY_COLORS = { y: '#ffe600', b: '#2d63c8', r: '#d83a3a', g: '#2f9e5b', p: '#7a4fc9', k: '#000000' }; // old color keys; also the cycle for new builds
const hslHex = (h, s, l) => {
  l /= 100; const a = s / 100 * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
};
const PALETTE = [ // ADJUSTABLE - banner color choices: 3 shades x 12 hues, then neutrals
  ...[78, 58, 36].flatMap(l => Array.from({ length: 12 }, (_, i) => hslHex(i * 30, 85, l))),
  '#000000', '#3a3f47', '#7b838f', '#c3c8d0', '#ffffff', '#ffe600'];
const inkFor = c => { const n = parseInt(c.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150 ? '#000' : '#fff'; };
const RES = [['f', 'Food'], ['w', 'Wood'], ['g', 'Gold'], ['s', 'Stone'], ['b', 'Build']]; // the 5 villager jobs
const TAGS = [...RES, ['a', 'Age'], ['x', 'Alert'], ['n', 'Plain']]; // toolbar color tags: {f:text}
const AUTO = [ // ADJUSTABLE - words colored automatically: [class, regex source]
  ['a', 'dark age|feudal|castle|imperial|age up|age'],
  ['f', 'food|berries|berry|sheep|deer|boar|fish|farms?|mills?'],
  ['w', 'wood|lumber|trees?|strag(?:gler)?s?'],
  ['g', 'gold|mines?'],
  ['s', 'stone'],
  ['b', 'houses?|barracks|stables?|archery range|range|camps?|market|blacksmith|monastery|keep|tc|town center|walls?|docks?|outpost|prod'],
];
const AUTO_RE = new RegExp('\\b(' + AUTO.map(a => a[1]).join('|') + ')\\b', 'gi');
const AUTO_T = AUTO.map(([c, p]) => [c, new RegExp('^(?:' + p + ')$', 'i')]);

// ── STATE ──  a step may carry opts: [{ name, steps: [...] }] (an Options / flex step)
const blankStep = () => ({ text: '', f: '', w: '', g: '', s: '', b: '' });
const normStep = (s, leaf) => {
  const o = Object.assign(blankStep(), s, { text: String(s?.text ?? '').slice(0, 500) });
  if (leaf || !Array.isArray(s?.opts)) delete o.opts;
  else o.opts = s.opts.slice(0, MAX_OPTIONS).map(x => ({ name: String(x?.name ?? '').slice(0, 60), steps: (Array.isArray(x?.steps) ? x.steps : []).slice(0, 100).map(t => normStep(t, true)) }));
  return o;
};
const normBuild = b => Object.assign({}, b, { // keeps unknown legacy fields untouched
  id: b.id || uid(), civ: CIVS[b.civ] ? b.civ : 'english', name: String(b.name ?? 'Build').slice(0, 120),
  color: /^#[0-9a-f]{6}$/i.test(b.color) ? b.color : LEGACY_COLORS[b.color] || '#ffe600',
  steps: (Array.isArray(b.steps) ? b.steps : []).slice(0, 300).map(s => normStep(s)),
});
let builds = store.get('builds', []).map(normBuild);
const saveBuilds = () => store.set('builds', builds);
let bCiv = store.get('buildCiv', 'english'); if (!CIVS[bCiv]) bCiv = 'english';
let edit = false, lastTA = null, focusSel = null, palOpen = null;
const chosen = {}, pos = {}, wheelTop = {}; // in-game only: picked option per options step, focused step per build, wheel scroll
const civSlugs = Object.keys(CIVS).sort((a, b) => civName(a).localeCompare(civName(b)));
const letter = k => String.fromCharCode(65 + k);
const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

// ── RICH TEXT ──  manual tags {f:text} override; otherwise AUTO words get colored
const rich = t => String(t).split(/(\{[fwgsbaxn]:[^}]*\})/).map(p => {
  const m = /^\{([fwgsbaxn]):([^}]*)\}$/.exec(p);
  return m ? `<span class="k-${m[1]}">${esc(m[2])}</span>`
    : esc(p).replace(AUTO_RE, w => `<span class="k-${AUTO_T.find(([, re]) => re.test(w))[0]}">${w}</span>`);
}).join('');

// ── ACTIVE SEQUENCE ──  main steps, with only the picked branch spliced in after its Options Step
function seqOf(b) {
  const out = [];
  b.steps.forEach((s, i) => {
    out.push({ s, i });
    const br = s.opts?.[chosen[b.id + ':' + i]];
    if (br) br.steps.forEach((t, j) => out.push({ s: t, i, o: chosen[b.id + ':' + i], j, tag: j === 0 ? br.name || letter(chosen[b.id + ':' + i]) : '' }));
  });
  return out;
}

// ── ROUTING ──
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/'), isB = h[0] === 'builds';
  $('#viewDash').hidden = isB; $('#viewBuilds').hidden = !isB;
  if (!isB) { $('#fmt').hidden = true; return; }
  if (h[1] === 'new') { addBuild(); history.replaceState(null, '', '#/builds/' + bCiv); return; }
  if (CIVS[h[1]]) { bCiv = h[1]; store.set('buildCiv', bCiv); }
  renderBuilds();
}
window.addEventListener('hashchange', route);
$('#bBack').onclick = () => { location.hash = '#/'; };
$('#bEdit').onclick = () => { edit = !edit; palOpen = null; renderBuilds(); };

// ── RENDER: EDIT MODE ──
const vlInputs = s => RES.map(([k]) => `<input type="number" inputmode="numeric" min="0" max="99" placeholder="${k.toUpperCase()}" data-r="${k}" class="k-${k}" value="${esc(s[k])}">`).join('');
function rowHtml(s, num, at, extra, i) { // i is set only for main-list steps (the only ones that can be Options Steps)
  const isOpt = s.opts && i !== undefined;
  return `<div class="st ed${isOpt ? ' opt' : ''}" ${at}><span class="sn">${num}</span>` +
    `<textarea rows="1" data-f="text" placeholder="${isOpt ? 'Decision, e.g. after aging up choose a plan' : 'e.g. rally 2 to gold + house, then rally strag'}">${esc(s.text)}</textarea><div class="pv">${rich(s.text)}</div>` +
    `<div class="vl">${vlInputs(s)}</div><div class="sa">${extra}<button class="btn sm" data-act="up">↑</button><button class="btn sm" data-act="down">↓</button><button class="btn sm danger" data-act="rm">✕</button></div>` +
    (isOpt ? `<div class="ob">${s.opts.map((o, k) => `<div class="oc" data-i="${i}" data-o="${k}"><div class="oh"><span class="lt">${letter(k)}</span>` +
      `<input class="oname" data-f="oname" maxlength="60" placeholder="Option name" value="${esc(o.name)}"><button class="btn sm danger" data-act="orm">✕</button></div>` +
      o.steps.map((t, j) => rowHtml(t, letter(k) + (j + 1), `data-i="${i}" data-o="${k}" data-j="${j}"`, '')).join('') +
      `<button class="add in" data-act="add-ostep">+ Step</button></div>`).join('')}<button class="add in" data-act="add-opt">+ Option</button></div>` : '') + '</div>';
}

// ── RENDER: EXECUTION (WHEEL) MODE ──
function viewRow(b, it, idx, cur) {
  const s = it.s, ci = chosen[b.id + ':' + it.i];
  const vl = RES.map(([k]) => s[k] !== '' && s[k] != null ? `<span class="k-${k}">${esc(s[k])}</span>` : '<span class="e">·</span>').join('');
  let extra = '';
  if (s.opts && it.o == null) extra = idx === cur
    ? `<div class="obtn${s.opts.length > 3 ? ' many' : ''}">${s.opts.map((o, k) => `<button class="btn${ci === k ? ' accent' : ''}" data-act="pick" data-i="${it.i}" data-k="${k}">${esc(o.name || letter(k))}</button>`).join('')}</div>`
    : `<div class="chosen">${s.opts[ci] ? '→ ' + esc(s.opts[ci].name || letter(ci)) : '⑂ ' + s.opts.map((o, k) => esc(o.name || letter(k))).join(' / ')}</div>`;
  return `<div class="st${idx === cur ? ' cur' : ''}${idx < cur ? ' past' : ''}${it.o != null ? ' br' : ''}" data-x="${idx}"><span class="sn">${idx + 1}</span>` +
    `<div class="tx">${it.tag ? `<div class="tag">${esc(it.tag)}</div>` : ''}${rich(s.text)}${extra}</div><div class="vl">${vl}</div></div>`;
}

function cardHtml(b) {
  const bg = b.color;
  const banner = `<div class="bn" style="background:${bg};color:${inkFor(bg)}">` + (edit
    ? `<div class="idbox"><select data-f="civ" aria-label="Civilization">${civSlugs.map(s => `<option value="${s}"${s === b.civ ? ' selected' : ''}>${esc(civName(s))}</option>`).join('')}</select>` +
      `<input class="bname" data-f="name" maxlength="120" placeholder="Build name" value="${esc(b.name)}"></div>` : esc(b.name)) + '</div>';
  const tools = !edit ? '' : `<div class="tools"><button class="sw0" data-act="pal" aria-label="Banner color" style="background:${bg}"></button>` +
    (palOpen === b.id ? `<div class="pal">${PALETTE.map(c => `<button data-act="color" data-c="${c}" aria-label="${c}" style="background:${c}"></button>`).join('')}</div>` : '') +
    '<span class="grow"></span><button class="btn sm" data-act="dup">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>';
  let body;
  if (edit) body = b.steps.map((s, i) => rowHtml(s, i + 1, `data-i="${i}"`, `<button class="btn sm${s.opts ? ' accent' : ''}" data-act="opts" title="Options (flex) step">⑂</button>`, i)).join('');
  else {
    const seq = seqOf(b), cur = Math.min(pos[b.id] ?? 0, seq.length - 1); pos[b.id] = cur;
    body = `<div class="vh">${RES.map(([k, n]) => `<span class="k-${k}" title="${n} villagers">${n[0]}</span>`).join('')}</div>` +
      `<div class="wheel" data-b="${b.id}">${seq.map((it, idx) => viewRow(b, it, idx, cur)).join('')}</div>`;
  }
  return `<section class="sheet" data-b="${b.id}">${banner}${tools}${body}<button class="add in" data-act="add-step">+ Step</button></section>`;
}
function renderBuilds() {
  document.querySelectorAll('.wheel').forEach(w => { wheelTop[w.dataset.b] = w.scrollTop; });
  const counts = {}; builds.forEach(b => counts[b.civ] = (counts[b.civ] || 0) + 1);
  $('#civList').innerHTML = civSlugs.map(s => `<button data-civ="${s}" aria-current="${s === bCiv}">${flagHtml(s)}<span>${esc(civName(s))}</span>${counts[s] ? `<span class="cnt">${counts[s]}</span>` : ''}</button>`).join('');
  $('#bTitle').textContent = `Build Orders · ${civName(bCiv)}`;
  $('#bEdit').textContent = edit ? 'Done' : 'Edit'; $('#bEdit').classList.toggle('accent', edit);
  const mine = builds.filter(b => b.civ === bCiv);
  $('#bMain').innerHTML = mine.length
    ? mine.map(cardHtml).join('') + (mine.length < MAX_BUILDS ? '<button class="add" data-act="new-build">+ New build</button>' : '')
    : `<div class="empty"><p><b>No build orders for ${esc(civName(bCiv))} yet.</b></p><button class="btn accent" data-act="new-build">+ Create build</button></div>`;
  $('#fmt').hidden = !edit;
  document.querySelectorAll('#bMain textarea').forEach(grow);
  document.querySelectorAll('.wheel').forEach(w => { // roll the focused step to the center (animated when it was already on screen)
    const c = w.querySelector('.cur'), id = w.dataset.b; if (!c) return;
    const to = c.offsetTop - (w.clientHeight - c.offsetHeight) / 2;
    if (wheelTop[id] == null) w.scrollTop = to; else { w.scrollTop = wheelTop[id]; w.scrollTo({ top: to, behavior: 'smooth' }); }
  });
  if (focusSel) { const el = $(focusSel); focusSel = null; el?.focus(); el?.select?.(); }
}
function addBuild() {
  const n = builds.filter(x => x.civ === bCiv).length, cycle = Object.values(LEGACY_COLORS);
  const b = normBuild({ civ: bCiv, name: 'New build', color: cycle[n % cycle.length], steps: [blankStep()] });
  builds.push(b); saveBuilds(); edit = true; focusSel = `.sheet[data-b="${b.id}"] .bname`; renderBuilds();
}

// ── EDIT HELPERS ──  a row is a main step (data-i) or a branch step (data-i + data-o + data-j)
const stepSel = (b, i, o, j) => `.sheet[data-b="${b.id}"] .st[data-i="${i}"]${o == null ? ':not([data-o])' : `[data-o="${o}"][data-j="${j}"]`} > textarea`;
function ctx(b, row) {
  const i = +row.dataset.i;
  if (row.dataset.o === undefined) return { list: b.steps, k: i, s: b.steps[i], sel: k => stepSel(b, k) };
  const o = +row.dataset.o, list = b.steps[i].opts[o].steps, k = +row.dataset.j;
  return { list, k, s: list[k], sel: n => stepSel(b, i, o, n) };
}
const buildOf = el => builds.find(x => x.id === el.closest('.sheet')?.dataset.b);

// ── EVENTS ──
$('#civList').onclick = e => { const b = e.target.closest('[data-civ]'); if (b) location.hash = '#/builds/' + b.dataset.civ; };
$('#bMain').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'), row = e.target.closest('.st'), oc = e.target.closest('.oc'), b = buildOf(e.target);
  if (palOpen && !e.target.closest('.pal,[data-act="pal"]')) { palOpen = null; if (!a) renderBuilds(); }
  if (!a) { // execution mode: tap the focused step to advance, any other step to jump to it
    if (edit || !row || !b) return;
    const x = +row.dataset.x, cur = Math.min(pos[b.id] ?? 0, seqOf(b).length - 1);
    pos[b.id] = x === cur ? Math.min(x + 1, seqOf(b).length - 1) : x; return renderBuilds();
  }
  const act = a.dataset.act;
  if (act === 'new-build') return addBuild();
  if (!b) return;
  if (act === 'pick') { // choosing an option is the decision made AT the Options Step; focus jumps into the branch
    const i = +a.dataset.i; chosen[b.id + ':' + i] = +a.dataset.k;
    const q = seqOf(b); pos[b.id] = Math.min(q.findIndex(z => z.i === i && z.o == null) + 1, q.length - 1); return renderBuilds();
  }
  if (act === 'pal') { palOpen = palOpen === b.id ? null : b.id; return renderBuilds(); }
  if (act === 'color') { b.color = a.dataset.c; palOpen = null; }
  else if (act === 'add-step') { b.steps.push(blankStep()); focusSel = stepSel(b, b.steps.length - 1); }
  else if (act === 'add-ostep') { const L = b.steps[+oc.dataset.i].opts[+oc.dataset.o].steps; L.push(blankStep()); focusSel = stepSel(b, +oc.dataset.i, +oc.dataset.o, L.length - 1); }
  else if (act === 'add-opt') { const s = b.steps[+row.dataset.i]; if (s.opts.length >= MAX_OPTIONS) return; s.opts.push({ name: '', steps: [blankStep()] }); }
  else if (act === 'orm') {
    const s = b.steps[+oc.dataset.i]; if (s.opts.length <= 2) return toast('An options step needs at least 2 options');
    s.opts.splice(+oc.dataset.o, 1); delete chosen[b.id + ':' + oc.dataset.i];
  } else if (act === 'opts') {
    const c = ctx(b, row), key = b.id + ':' + c.k;
    if (c.s.opts) { if (c.s.opts.some(o => o.steps.some(t => t.text)) && !confirm('Remove all options from this step?')) return; delete c.s.opts; delete chosen[key]; }
    else c.s.opts = [{ name: '', steps: [blankStep()] }, { name: '', steps: [blankStep()] }];
  } else if (act === 'rm') { const c = ctx(b, row); c.list.splice(c.k, 1); if (!c.list.length) c.list.push(blankStep()); }
  else if (act === 'up' || act === 'down') {
    const c = ctx(b, row), n = c.k + (act === 'up' ? -1 : 1); if (n < 0 || n >= c.list.length) return;
    [c.list[n], c.list[c.k]] = [c.list[c.k], c.list[n]]; focusSel = c.sel(n);
  } else if (act === 'dup') { const c = normBuild(JSON.parse(JSON.stringify(b))); c.id = uid(); c.name += ' (copy)'; builds.splice(builds.indexOf(b) + 1, 0, c); }
  else if (act === 'del') { if (!confirm(`Delete “${b.name}”?`)) return; builds = builds.filter(x => x !== b); }
  else return;
  saveBuilds(); renderBuilds();
});
$('#bMain').addEventListener('input', e => { // typing never re-renders, so focus is kept
  const t = e.target, row = t.closest('.st'), oc = t.closest('.oc'), b = buildOf(t);
  if (!b) return;
  if (t.dataset.f === 'oname') b.steps[+oc.dataset.i].opts[+oc.dataset.o].name = t.value;
  else if (t.dataset.r) ctx(b, row).s[t.dataset.r] = t.value.slice(0, 2);
  else if (t.dataset.f === 'text') { ctx(b, row).s.text = t.value; grow(t); row.querySelector(':scope > .pv').innerHTML = rich(t.value); }
  else if (t.dataset.f === 'name') b.name = t.value;
  else return;
  saveBuilds();
});
$('#bMain').addEventListener('change', e => { // reassign a build to another civilization
  const t = e.target, b = buildOf(t);
  if (b && t.dataset.f === 'civ') { b.civ = t.value; saveBuilds(); location.hash = '#/builds/' + b.civ; }
});
$('#bMain').addEventListener('keydown', e => { // Enter = next step, Backspace on an empty step = delete it
  const t = e.target; if (t.dataset?.f !== 'text') return;
  const b = buildOf(t), c = ctx(b, t.closest('.st'));
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); c.list.splice(c.k + 1, 0, blankStep()); focusSel = c.sel(c.k + 1); }
  else if (e.key === 'Backspace' && !t.value && c.list.length > 1) { e.preventDefault(); c.list.splice(c.k, 1); focusSel = c.sel(Math.max(0, c.k - 1)); }
  else return;
  saveBuilds(); renderBuilds();
});
$('#bMain').addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA') lastTA = e.target; });

// ── COLOR TOOLBAR ── wraps the selected text of the last-focused step in a {tag:...}
$('#fmt').innerHTML = '<span class="hint">Color</span>' + TAGS.map(([k, n]) => `<button class="btn sm k-${k}" data-k="${k}">${n}</button>`).join('');
$('#fmt').addEventListener('mousedown', e => e.preventDefault()); // keep the keyboard / selection
$('#fmt').addEventListener('click', e => {
  const k = e.target.closest('[data-k]')?.dataset.k, ta = lastTA;
  if (!k || !ta || !ta.isConnected) return;
  const a = ta.selectionStart, z = ta.selectionEnd;
  ta.setRangeText(`{${k}:${ta.value.slice(a, z)}}`, a, z, 'end');
  if (a === z) ta.setSelectionRange(a + 3, a + 3);
  ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus();
});

// ── IMPORT / EXPORT ──
$('#bExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'aoe4-companion', version: 3, builds }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'aoe4-build-orders.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#bImport').onclick = () => $('#bFile').click();
$('#bFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), arr = Array.isArray(j) ? j : j.builds; if (!Array.isArray(arr)) throw 0;
    let n = 0;
    for (const x of arr) { if (x && typeof x.name === 'string' && Array.isArray(x.steps)) { builds.push(normBuild({ ...x, id: uid(), civ: CIVS[x.civ] ? x.civ : bCiv })); n++; } }
    saveBuilds(); renderBuilds(); toast(`Imported ${n} build${n === 1 ? '' : 's'}`);
  } catch { toast('That file is not a valid build-order export'); }
};

/* ---------- Boot ---------- */
if (location.hash) history.replaceState(null, '', location.pathname + location.search); // always launch on the stats dashboard
// ── DOCK HEIGHT ── keeps page content clear of the fixed bottom panel
const dockObs = new ResizeObserver(es => es.forEach(en => { if (en.target.offsetHeight) document.documentElement.style.setProperty('--dock', en.target.offsetHeight + 'px'); }));
document.querySelectorAll('.dock').forEach(d => dockObs.observe(d));
render();
route();
refresh(false).then(() => { lastRefresh = Date.now(); });
</script>
</body>
</html>
